<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farma Export PDF</title>
    <!-- Tailwind CSS per la grafica -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PDF.js per la visualizzazione e manipolazione dei PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
    <!-- jsPDF per la generazione di file PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        .pdf-annotation-box {
            position: absolute;
            background: rgba(255, 255, 255, 0.05);
            border: 1px dashed rgba(59, 130, 246, 0.6);
            border-radius: 4px;
            z-index: 50;
            display: flex;
            flex-direction: column;
            overflow: visible;
            min-width: 60px;
            min-height: 24px;
            transition: border-color 0.2s;
        }
        .pdf-annotation-box:hover {
            border-color: #3b82f6;
            background: rgba(59, 130, 246, 0.08);
        }
        .pdf-annotation-header {
            background: transparent;
            cursor: move;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 2px;
            user-select: none;
            font-size: 10px;
            color: rgba(0, 0, 0, 0.5);
            height: 12px;
            margin-top: -12px;
        }
        .pdf-text-input {
            width: 100%;
            height: 100%;
            border: none;
            outline: none;
            background: transparent;
            padding: 1px 2px;
            resize: both;
            box-sizing: border-box;
            line-height: 1.1;
        }
        @media print {
            body * {
                visibility: hidden !important;
            }
            #print-container, #print-container * {
                visibility: visible !important;
            }
            #print-container {
                position: absolute !important;
                left: 0 !important;
                top: 0 !important;
                width: 100% !important;
                background: white !important;
            }
            .print-page-wrapper {
                page-break-after: always;
                page-break-inside: avoid;
                display: flex !important;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                width: 100%;
                margin-bottom: 20px;
            }
            .print-page-wrapper img {
                max-width: 100% !important;
                height: auto !important;
            }
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Header / Barra degli Strumenti Principale -->
    <header class="bg-slate-800 border-b border-slate-700 px-4 py-3 flex flex-wrap items-center justify-between gap-4 shadow-md">
        <div class="flex items-center space-x-3">
            <span class="bg-blue-600 text-white font-bold p-2 rounded-lg text-lg">FE</span>
            <div>
                <h1 class="font-bold text-lg text-slate-100">Farma Export PDF</h1>
                <p id="fileNameEl" class="text-xs text-slate-400">Nessun file caricato</p>
            </div>
        </div>

        <div class="flex flex-wrap items-center gap-2">
            <!-- Pulsante Carica PDF -->
            <label class="bg-blue-600 hover:bg-blue-500 text-white text-sm font-semibold px-4 py-2 rounded-lg cursor-pointer transition flex items-center gap-2 shadow">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
                Apri PDF
                <input type="file" id="fileInput" accept="application/pdf" class="hidden">
            </label>

            <!-- Pulsante Conversione Immagini in PDF -->
            <button id="openImageModalBtn" class="bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-semibold px-4 py-2 rounded-lg transition flex items-center gap-2 shadow">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                Converti immagine in pdf
            </button>

            <!-- Pulsante Esempio -->
            <button id="btnSample" class="bg-slate-700 hover:bg-slate-600 text-slate-200 text-sm font-medium px-3 py-2 rounded-lg transition">
                PDF Esempio
            </button>

            <!-- Modifica / Aggiungi Testo -->
            <button id="btnAddText" class="bg-amber-600 hover:bg-amber-500 text-white text-sm font-semibold px-4 py-2 rounded-lg transition flex items-center gap-2 shadow">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                Modifica / Scrivi
            </button>

            <!-- Salva PDF -->
            <button id="btnSavePdf" class="bg-green-600 hover:bg-green-500 text-white text-sm font-semibold px-4 py-2 rounded-lg transition flex items-center gap-2 shadow">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"/></svg>
                Salva PDF
            </button>

            <!-- Stampa -->
            <button id="btnPrint" class="bg-slate-700 hover:bg-slate-600 text-slate-200 text-sm font-medium px-3 py-2 rounded-lg transition">
                Stampa
            </button>
        </div>
    </header>

    <!-- Barra di formattazione del testo -->
    <div id="textFormattingBar" class="bg-slate-800/90 border-b border-slate-700 px-4 py-2 flex flex-wrap items-center gap-4 text-sm text-slate-200 hidden">
        <div class="flex items-center gap-1">
            <span class="text-xs text-slate-400">Font:</span>
            <select id="fontFamilySelect" class="bg-slate-900 border border-slate-700 rounded px-2 py-1 text-xs text-slate-100">
                <option value="Arial, sans-serif">Arial</option>
                <option value="'Times New Roman', serif">Times New Roman</option>
                <option value="'Courier New', monospace">Courier New</option>
                <option value="Georgia, serif">Georgia</option>
                <option value="Verdana, sans-serif">Verdana</option>
            </select>
        </div>

        <div class="flex items-center gap-1">
            <span class="text-xs text-slate-400">Dimensione:</span>
            <input type="number" id="fontSizeInput" value="14" min="8" max="72" class="w-14 bg-slate-900 border border-slate-700 text-center rounded py-1 text-xs text-slate-100">
        </div>

        <div class="flex items-center gap-1 bg-slate-900 border border-slate-700 rounded p-0.5">
            <button id="btnBold" class="px-2 py-0.5 hover:bg-slate-700 rounded font-bold text-xs" title="Grassetto">B</button>
            <button id="btnItalic" class="px-2 py-0.5 hover:bg-slate-700 rounded italic text-xs" title="Corsivo">I</button>
            <button id="btnUnderline" class="px-2 py-0.5 hover:bg-slate-700 rounded underline text-xs" title="Sottolineato">U</button>
        </div>

        <div class="flex items-center gap-1">
            <span class="text-xs text-slate-400">Colore:</span>
            <input type="color" id="fontColorInput" value="#0f172a" class="w-7 h-7 bg-transparent border-0 cursor-pointer rounded">
        </div>
        
        <span class="text-xs text-amber-400 ml-auto">💡 Clicca sul testo del PDF per modificarlo o in un punto vuoto per aggiungere nuovo testo.</span>
    </div>

    <!-- Barra di navigazione pagine e zoom -->
    <div class="bg-slate-800/60 border-b border-slate-700/50 px-4 py-2 flex flex-wrap items-center justify-between gap-2 text-sm text-slate-300">
        <div class="flex items-center space-x-2">
            <button id="btnFirst" class="p-1.5 hover:bg-slate-700 rounded disabled:opacity-40" title="Prima Pagina">⏮</button>
            <button id="btnPrev" class="p-1.5 hover:bg-slate-700 rounded disabled:opacity-40" title="Pagina Precedente">◀</button>
            <div class="flex items-center space-x-1">
                <span>Pagina</span>
                <input type="number" id="pageNumInput" value="1" min="1" class="w-14 bg-slate-900 border border-slate-700 text-center rounded py-1 text-slate-100">
                <span>di <span id="pageCount">0</span></span>
            </div>
            <button id="btnNext" class="p-1.5 hover:bg-slate-700 rounded disabled:opacity-40" title="Pagina Successiva">▶</button>
            <button id="btnLast" class="p-1.5 hover:bg-slate-700 rounded disabled:opacity-40" title="Ultima Pagina">⏭</button>
        </div>

        <div class="flex items-center space-x-3">
            <button id="btnZoomOut" class="p-1.5 hover:bg-slate-700 rounded" title="Zoom Indietro">🔍-</button>
            <span id="zoomValue" class="w-12 text-center">100%</span>
            <button id="btnZoomIn" class="p-1.5 hover:bg-slate-700 rounded" title="Zoom Avanti">🔍+</button>
            <button id="btnZoomReset" class="px-2 py-1 bg-slate-700 hover:bg-slate-600 rounded text-xs">Adatta</button>
            <button id="btnRotate" class="p-1.5 hover:bg-slate-700 rounded" title="Ruota">🔄 Ruota</button>
        </div>
    </div>

    <!-- Area principale di visualizzazione PDF -->
    <main id="viewerContainer" class="flex-1 relative flex items-center justify-center p-4 overflow-auto bg-slate-950">
        <div id="dropOverlay" class="absolute inset-0 bg-slate-900/80 backdrop-blur-sm flex flex-col items-center justify-center pointer-events-none opacity-0 transition-opacity duration-300 z-30">
            <svg class="w-16 h-16 text-blue-500 mb-2 animate-bounce" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
            <p class="text-xl font-bold text-slate-200">Rilascia qui il file PDF</p>
        </div>

        <div id="loadingSpinner" class="absolute inset-0 bg-slate-900/50 backdrop-blur-xs flex flex-col items-center justify-center z-20 hidden">
            <div class="w-10 h-10 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mb-3"></div>
            <p id="loadingText" class="text-sm font-medium text-slate-200">Caricamento...</p>
        </div>

        <div id="errorMessage" class="absolute inset-0 bg-slate-900/90 flex flex-col items-center justify-center z-20 hidden p-6 text-center">
            <svg class="w-12 h-12 text-red-500 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
            <p id="errorText" class="text-base font-semibold text-slate-200 mb-2">Errore</p>
        </div>

        <!-- Contenitore Canvas del PDF -->
        <div id="canvasWrapper" class="relative shadow-2xl bg-white rounded overflow-hidden">
            <canvas id="pdfCanvas" class="block"></canvas>
            <div id="annotationsLayer" class="absolute inset-0 pointer-events-none"></div>
        </div>
    </main>

    <!-- Container nascosto per la stampa -->
    <div id="print-container"></div>

    <!-- Script principale applicativo -->
    <script>
        const state = {
            pdfDoc: null,
            pageNum: 1,
            pageRendering: false,
            pageNumPending: null,
            scale: 1.2,
            rotation: 0,
            fileName: '',
            isEditMode: false,
            annotations: {},
            originalTextsParsed: {},
            currentStyle: {
                fontFamily: 'Arial, sans-serif',
                fontSize: 14,
                bold: false,
                italic: false,
                underline: false,
                color: '#0f172a'
            }
        };

        const canvas = document.getElementById('pdfCanvas');
        const ctx = canvas.getContext('2d');
        const canvasWrapper = document.getElementById('canvasWrapper');
        const annotationsLayer = document.getElementById('annotationsLayer');
        const textFormattingBar = document.getElementById('textFormattingBar');
        
        const fileInput = document.getElementById('fileInput');
        const fileNameEl = document.getElementById('fileNameEl');
        const pageNumInput = document.getElementById('pageNumInput');
        const pageCountEl = document.getElementById('pageCount');
        const zoomValueEl = document.getElementById('zoomValue');
        
        const btnPrev = document.getElementById('btnPrev');
        const btnNext = document.getElementById('btnNext');
        const btnFirst = document.getElementById('btnFirst');
        const btnLast = document.getElementById('btnLast');
        const btnZoomIn = document.getElementById('btnZoomIn');
        const btnZoomOut = document.getElementById('btnZoomOut');
        const btnZoomReset = document.getElementById('btnZoomReset');
        const btnRotate = document.getElementById('btnRotate');
        const btnSample = document.getElementById('btnSample');
        const btnAddText = document.getElementById('btnAddText');
        const btnSavePdf = document.getElementById('btnSavePdf');
        const btnPrint = document.getElementById('btnPrint');
        const viewerContainer = document.getElementById('viewerContainer');
        const dropOverlay = document.getElementById('dropOverlay');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const loadingText = document.getElementById('loadingText');
        const errorMessage = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');

        const fontFamilySelect = document.getElementById('fontFamilySelect');
        const fontSizeInput = document.getElementById('fontSizeInput');
        const btnBold = document.getElementById('btnBold');
        const btnItalic = document.getElementById('btnItalic');
        const btnUnderline = document.getElementById('btnUnderline');
        const fontColorInput = document.getElementById('fontColorInput');

        fontFamilySelect.addEventListener('change', (e) => state.currentStyle.fontFamily = e.target.value);
        fontSizeInput.addEventListener('input', (e) => state.currentStyle.fontSize = parseInt(e.target.value) || 14);
        fontColorInput.addEventListener('input', (e) => state.currentStyle.color = e.target.value);

        btnBold.addEventListener('click', () => {
            state.currentStyle.bold = !state.currentStyle.bold;
            btnBold.classList.toggle('bg-slate-700', state.currentStyle.bold);
        });
        btnItalic.addEventListener('click', () => {
            state.currentStyle.italic = !state.currentStyle.italic;
            btnItalic.classList.toggle('bg-slate-700', state.currentStyle.italic);
        });
        btnUnderline.addEventListener('click', () => {
            state.currentStyle.underline = !state.currentStyle.underline;
            btnUnderline.classList.toggle('bg-slate-700', state.currentStyle.underline);
        });

        function renderPage(num) {
            state.pageRendering = true;
            showLoading(true, `Rendering pagina ${num}...`);

            state.pdfDoc.getPage(num).then(async page => {
                const viewport = page.getViewport({ scale: state.scale, rotation: state.rotation });
                const outputScale = window.devicePixelRatio || 1;
                canvas.width = Math.floor(viewport.width * outputScale);
                canvas.height = Math.floor(viewport.height * outputScale);
                
                canvas.style.width = Math.floor(viewport.width) + "px";
                canvas.style.height = Math.floor(viewport.height) + "px";

                const transform = outputScale !== 1 ? [outputScale, 0, 0, outputScale, 0, 0] : null;

                await page.render({ canvasContext: ctx, transform: transform, viewport: viewport }).promise;

                // Estrai il testo originale una sola volta
                if (!state.originalTextsParsed[num]) {
                    state.originalTextsParsed[num] = true;
                    const textContent = await page.getTextContent();
                    if (!state.annotations[num]) state.annotations[num] = [];

                    textContent.items.forEach(item => {
                        if (item.str && item.str.trim().length > 0) {
                            const tx = pdfjsLib.Util.transform(viewport.transform, item.transform);
                            const fontHeight = Math.sqrt(tx[2] * tx[2] + tx[3] * tx[3]);
                            const x = tx[4];
                            const y = tx[5] - fontHeight;

                            state.annotations[num].push({
                                id: Date.now() + Math.random(),
                                x: x,
                                y: y,
                                origX: x,
                                origY: y,
                                origW: item.width * state.scale,
                                origH: fontHeight * 1.2,
                                isOriginal: true,
                                isModifiedOrDeleted: false,
                                text: item.str,
                                width: Math.max(item.width * state.scale, 50),
                                height: Math.max(fontHeight * 1.3, 22),
                                style: {
                                    fontFamily: 'Arial, sans-serif',
                                    fontSize: Math.round(fontHeight),
                                    bold: false,
                                    italic: false,
                                    underline: false,
                                    color: '#0f172a'
                                }
                            });
                        }
                    });
                }

                // Cancella dal canvas visibile i testi originali che sono stati modificati o cancellati
                const annos = state.annotations[num] || [];
                annos.forEach(anno => {
                    if (anno.isOriginal && anno.isModifiedOrDeleted) {
                        ctx.save();
                        if (outputScale !== 1) ctx.scale(outputScale, outputScale);
                        ctx.fillStyle = "#ffffff";
                        ctx.fillRect(anno.origX - 2, anno.origY - 2, anno.origW + 4, anno.origH + 4);
                        ctx.restore();
                    }
                });

                state.pageRendering = false;
                showLoading(false);
                renderAnnotationsForCurrentPage();

                if (state.pageNumPending !== null) {
                    const nextNum = state.pageNumPending;
                    state.pageNumPending = null;
                    renderPage(nextNum);
                }
            }).catch(err => {
                console.error(err);
                state.pageRendering = false;
                showLoading(false);
            });

            pageNumInput.value = num;
            updateControlsState();
        }

        function queueRenderPage(num) {
            if (state.pageRendering) {
                state.pageNumPending = num;
            } else {
                renderPage(num);
            }
        }

        function updateControlsState() {
            if (!state.pdfDoc) return;
            btnPrev.disabled = state.pageNum <= 1;
            btnFirst.disabled = state.pageNum <= 1;
            btnNext.disabled = state.pageNum >= state.pdfDoc.numPages;
            btnLast.disabled = state.pageNum >= state.pdfDoc.numPages;
            zoomValueEl.textContent = `${Math.round(state.scale * 100)}%`;
        }

        function loadPDFData(data, name = 'documento.pdf') {
            showError(false);
            showLoading(true, 'Caricamento PDF...');
            state.fileName = name;
            fileNameEl.textContent = name;
            state.annotations = {};
            state.originalTextsParsed = {};
            state.pageRendering = false;
            state.pageNumPending = null;

            pdfjsLib.getDocument(data).promise.then(pdfDoc_ => {
                state.pdfDoc = pdfDoc_;
                state.pageNum = 1;
                state.rotation = 0;
                pageCountEl.textContent = state.pdfDoc.numPages;
                pageNumInput.max = state.pdfDoc.numPages;
                renderPage(state.pageNum);
            }).catch(err => {
                console.error(err);
                showLoading(false);
                showError(true, 'Impossibile leggere il file PDF.');
            });
        }

        function loadSamplePDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.setFillColor(255, 255, 255);
            doc.rect(0, 0, 210, 297, 'F');
            doc.setTextColor(30, 58, 138);
            doc.setFontSize(22);
            doc.text("FARMA EXPORT PDF", 20, 30);
            doc.setTextColor(15, 23, 42);
            doc.setFontSize(13);
            doc.text("Clicca su questo testo per modificarlo direttamente.", 20, 45);

            const pdfArrayBuffer = doc.output('arraybuffer');
            loadPDFData(pdfArrayBuffer, 'Esempio_Modificabile.pdf');
        }

        // Attivazione modalità scrittura/modifica
        btnAddText.addEventListener('click', () => {
            state.isEditMode = !state.isEditMode;
            if (state.isEditMode) {
                btnAddText.classList.remove('bg-amber-600', 'hover:bg-amber-500');
                btnAddText.classList.add('bg-green-600', 'hover:bg-green-500', 'ring-2', 'ring-white');
                textFormattingBar.classList.remove('hidden');
                textFormattingBar.classList.add('flex');
                canvasWrapper.style.cursor = 'crosshair';
            } else {
                btnAddText.classList.remove('bg-green-600', 'hover:bg-green-500', 'ring-2', 'ring-white');
                btnAddText.classList.add('bg-amber-600', 'hover:bg-amber-500');
                textFormattingBar.classList.remove('flex');
                textFormattingBar.classList.add('hidden');
                canvasWrapper.style.cursor = 'default';
            }
        });

        // Click sul canvas per aggiungere un nuovo testo
        canvasWrapper.addEventListener('click', (e) => {
            if (!state.isEditMode || !state.pdfDoc) return;
            if (e.target.closest('.pdf-annotation-box')) return;

            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            if (x < 0 || y < 0 || x > canvas.width || y > canvas.height) return;

            if (!state.annotations[state.pageNum]) {
                state.annotations[state.pageNum] = [];
            }

            state.annotations[state.pageNum].push({
                id: Date.now() + Math.random(),
                x: x,
                y: y,
                isOriginal: false,
                isModifiedOrDeleted: false,
                text: '',
                width: 140,
                height: 30,
                style: { ...state.currentStyle }
            });

            renderAnnotationsForCurrentPage();
        });

        function renderAnnotationsForCurrentPage() {
            annotationsLayer.innerHTML = '';
            const annos = state.annotations[state.pageNum] || [];

            annos.forEach((anno) => {
                if (anno.isOriginal && anno.isModifiedOrDeleted && anno.text.trim() === '') {
                    return; // Se è un testo originale cancellato senza nuovo testo, non mostrarlo
                }

                const container = document.createElement('div');
                container.className = 'pdf-annotation-box pointer-events-auto';
                container.style.left = `${anno.x}px`;
                container.style.top = `${anno.y}px`;
                container.style.width = `${anno.width}px`;
                container.style.height = `${anno.height}px`;

                // Barra superiore trasparente
                const header = document.createElement('div');
                header.className = 'pdf-annotation-header';
                
                const dragHandle = document.createElement('span');
                dragHandle.innerHTML = '⋮⋮';
                dragHandle.title = 'Trascina per spostare';
                
                const deleteBtn = document.createElement('button');
                deleteBtn.innerHTML = '&times;';
                deleteBtn.className = 'font-bold text-red-500 hover:text-red-700 px-1 text-xs leading-none';
                deleteBtn.title = 'Elimina';
                
                deleteBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (anno.isOriginal) {
                        anno.isModifiedOrDeleted = true;
                        anno.text = '';
                    } else {
                        const list = state.annotations[state.pageNum];
                        const idx = list.findIndex(a => a.id === anno.id);
                        if (idx !== -1) list.splice(idx, 1);
                    }
                    renderPage(state.pageNum);
                });

                header.appendChild(dragHandle);
                header.appendChild(deleteBtn);

                const textarea = document.createElement('textarea');
                textarea.className = 'pdf-text-input';
                textarea.value = anno.text;
                textarea.placeholder = 'Scrivi...';
                textarea.style.fontFamily = anno.style.fontFamily;
                textarea.style.fontSize = `${anno.style.fontSize}px`;
                textarea.style.fontWeight = anno.style.bold ? 'bold' : 'normal';
                textarea.style.fontStyle = anno.style.italic ? 'italic' : 'normal';
                textarea.style.textDecoration = anno.style.underline ? 'underline' : 'none';
                textarea.style.color = anno.style.color;

                textarea.addEventListener('focus', () => {
                    if (anno.isOriginal && !anno.isModifiedOrDeleted) {
                        anno.isModifiedOrDeleted = true;
                        renderPage(state.pageNum);
                    }
                });

                textarea.addEventListener('input', (e) => {
                    anno.text = e.target.value;
                    if (anno.isOriginal && !anno.isModifiedOrDeleted) {
                        anno.isModifiedOrDeleted = true;
                        renderPage(state.pageNum);
                    }
                });

                textarea.addEventListener('mouseup', () => {
                    anno.width = parseFloat(container.style.width) || anno.width;
                    anno.height = parseFloat(container.style.height) || anno.height;
                });

                // Gestione Trascina (Drag & Drop)
                let isDragging = false;
                let startX, startY, initialLeft, initialTop;

                header.addEventListener('mousedown', (e) => {
                    if (e.target === deleteBtn) return;
                    isDragging = true;
                    startX = e.clientX;
                    startY = e.clientY;
                    initialLeft = anno.x;
                    initialTop = anno.y;

                    if (anno.isOriginal && !anno.isModifiedOrDeleted) {
                        anno.isModifiedOrDeleted = true;
                        renderPage(state.pageNum);
                    }

                    const onMouseMove = (moveEvent) => {
                        if (!isDragging) return;
                        const dx = moveEvent.clientX - startX;
                        const dy = moveEvent.clientY - startY;

                        let newX = Math.max(0, Math.min(initialLeft + dx, canvas.width - container.offsetWidth));
                        let newY = Math.max(0, Math.min(initialTop + dy, canvas.height - container.offsetHeight));

                        anno.x = newX;
                        anno.y = newY;
                        container.style.left = `${newX}px`;
                        container.style.top = `${newY}px`;
                    };

                    const onMouseUp = () => {
                        isDragging = false;
                        document.removeEventListener('mousemove', onMouseMove);
                        document.removeEventListener('mouseup', onMouseUp);
                    };

                    document.addEventListener('mousemove', onMouseMove);
                    document.addEventListener('mouseup', onMouseUp);
                });

                container.appendChild(header);
                container.appendChild(textarea);
                annotationsLayer.appendChild(container);
            });
        }

        // Stampa corretta senza pagine bianche
        btnPrint.addEventListener('click', async () => {
            if (!state.pdfDoc) return;
            showLoading(true, 'Preparazione stampa...');

            const printContainer = document.getElementById('print-container');
            printContainer.innerHTML = '';

            try {
                for (let i = 1; i <= state.pdfDoc.numPages; i++) {
                    const page = await state.pdfDoc.getPage(i);
                    const viewport = page.getViewport({ scale: 2.0, rotation: state.rotation });

                    const pCanvas = document.createElement('canvas');
                    const pCtx = pCanvas.getContext('2d');
                    pCanvas.width = viewport.width;
                    pCanvas.height = viewport.height;

                    await page.render({ canvasContext: pCtx, viewport: viewport }).promise;

                    // Copri i testi originali cancellati/modificati
                    const annos = state.annotations[i] || [];
                    annos.forEach(anno => {
                        if (anno.isOriginal && anno.isModifiedOrDeleted) {
                            const ratio = 2.0 / state.scale;
                            pCtx.fillStyle = "#ffffff";
                            pCtx.fillRect((anno.origX - 2) * ratio, (anno.origY - 2) * ratio, (anno.origW + 4) * ratio, (anno.origH + 4) * ratio);
                        }
                    });

                    // Disegna i testi modificati o nuovi
                    annos.forEach(anno => {
                        if (anno.text.trim() !== '') {
                            const ratio = 2.0 / state.scale;
                            let fontStyleStr = '';
                            if (anno.style.bold) fontStyleStr += 'bold ';
                            if (anno.style.italic) fontStyleStr += 'italic ';
                            pCtx.font = `${fontStyleStr}${anno.style.fontSize * ratio}px ${anno.style.fontFamily}`;
                            pCtx.fillStyle = anno.style.color;
                            
                            const lines = anno.text.split('\n');
                            lines.forEach((line, index) => {
                                pCtx.fillText(line, anno.x * ratio, (anno.y + (anno.style.fontSize * 0.9) + (index * (anno.style.fontSize * 1.2))) * ratio);
                            });
                        }
                    });

                    const img = document.createElement('img');
                    img.src = pCanvas.toDataURL('image/png');
                    
                    const pageWrapper = document.createElement('div');
                    pageWrapper.className = 'print-page-wrapper';
                    pageWrapper.appendChild(img);
                    printContainer.appendChild(pageWrapper);
                }

                showLoading(false);
                setTimeout(() => {
                    window.print();
                }, 300);
            } catch (err) {
                console.error('Errore durante la stampa:', err);
                showLoading(false);
                alert('Si è verificato un errore durante la generazione della stampa.');
            }
        });

        // Salvataggio PDF
        btnSavePdf.addEventListener('click', async () => {
            if (!state.pdfDoc) return;
            showLoading(true, 'Generazione PDF...');

            try {
                const { jsPDF } = window.jspdf;
                let pdfDocJs = null;

                for (let i = 1; i <= state.pdfDoc.numPages; i++) {
                    const page = await state.pdfDoc.getPage(i);
                    const viewport = page.getViewport({ scale: 1.5, rotation: state.rotation });
                    
                    const tmpCanvas = document.createElement('canvas');
                    const tmpCtx = tmpCanvas.getContext('2d');
                    tmpCanvas.width = viewport.width;
                    tmpCanvas.height = viewport.height;

                    await page.render({ canvasContext: tmpCtx, viewport: viewport }).promise;

                    const annos = state.annotations[i] || [];
                    annos.forEach(anno => {
                        if (anno.isOriginal && anno.isModifiedOrDeleted) {
                            const ratio = 1.5 / state.scale;
                            tmpCtx.fillStyle = "#ffffff";
                            tmpCtx.fillRect((anno.origX - 2) * ratio, (anno.origY - 2) * ratio, (anno.origW + 4) * ratio, (anno.origH + 4) * ratio);
                        }
                    });

                    annos.forEach(anno => {
                        if (anno.text.trim() !== '') {
                            const ratio = 1.5 / state.scale;
                            let fontStyleStr = '';
                            if (anno.style.bold) fontStyleStr += 'bold ';
                            if (anno.style.italic) fontStyleStr += 'italic ';
                            tmpCtx.font = `${fontStyleStr}${anno.style.fontSize * ratio}px ${anno.style.fontFamily}`;
                            tmpCtx.fillStyle = anno.style.color;
                            
                            const lines = anno.text.split('\n');
                            lines.forEach((line, index) => {
                                tmpCtx.fillText(line, anno.x * ratio, (anno.y + (anno.style.fontSize * 0.9) + (index * (anno.style.fontSize * 1.2))) * ratio);
                            });
                        }
                    });

                    const imgData = tmpCanvas.toDataURL('image/jpeg', 0.95);
                    const pdfW = viewport.width / 1.5 * 0.352778;
                    const pdfH = viewport.height / 1.5 * 0.352778;

                    if (i === 1) {
                        pdfDocJs = new jsPDF({ orientation: pdfW > pdfH ? 'landscape' : 'portrait', unit: 'mm', format: [pdfW, pdfH] });
                    } else {
                        pdfDocJs.addPage([pdfW, pdfH], pdfW > pdfH ? 'landscape' : 'portrait');
                    }

                    pdfDocJs.addImage(imgData, 'JPEG', 0, 0, pdfW, pdfH);
                }

                showLoading(false);
                pdfDocJs.save(`Modificato_${state.fileName}`);
            } catch (err) {
                console.error(err);
                showLoading(false);
                alert('Errore durante il salvataggio.');
            }
        });

        // Event listeners di navigazione e zoom
        btnPrev.addEventListener('click', () => { if (state.pageNum > 1) { state.pageNum--; queueRenderPage(state.pageNum); } });
        btnNext.addEventListener('click', () => { if (state.pageNum < state.pdfDoc.numPages) { state.pageNum++; queueRenderPage(state.pageNum); } });
        btnFirst.addEventListener('click', () => { if (state.pageNum !== 1) { state.pageNum = 1; queueRenderPage(state.pageNum); } });
        btnLast.addEventListener('click', () => { if (state.pageNum !== state.pdfDoc.numPages) { state.pageNum = state.pdfDoc.numPages; queueRenderPage(state.pageNum); } });

        pageNumInput.addEventListener('change', (e) => {
            let val = parseInt(e.target.value);
            if (isNaN(val) || val < 1) val = 1;
            if (val > state.pdfDoc.numPages) val = state.pdfDoc.numPages;
            state.pageNum = val;
            queueRenderPage(state.pageNum);
        });

        btnZoomIn.addEventListener('click', () => { if (state.scale < 3.0) { state.scale += 0.25; queueRenderPage(state.pageNum); } });
        btnZoomOut.addEventListener('click', () => { if (state.scale > 0.5) { state.scale -= 0.25; queueRenderPage(state.pageNum); } });
        btnZoomReset.addEventListener('click', () => {
            const containerWidth = viewerContainer.clientWidth - 64;
            state.pdfDoc.getPage(state.pageNum).then(page => {
                const unscaledViewport = page.getViewport({ scale: 1, rotation: state.rotation });
                state.scale = Math.max(0.5, Math.min(2.5, containerWidth / unscaledViewport.width));
                queueRenderPage(state.pageNum);
            });
        });
        btnRotate.addEventListener('click', () => { state.rotation = (state.rotation + 90) % 360; queueRenderPage(state.pageNum); });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (evt) => loadPDFData(evt.target.result, file.name);
            reader.readAsArrayBuffer(file);
        });

        btnSample.addEventListener('click', loadSamplePDF);

        function showLoading(show, text = 'Caricamento...') {
            if (show) {
                loadingText.textContent = text;
                loadingSpinner.classList.remove('hidden');
                loadingSpinner.classList.add('flex');
            } else {
                loadingSpinner.classList.add('hidden');
                loadingSpinner.classList.remove('flex');
            }
        }

        function showError(show, message = '') {
            if (show) {
                errorText.textContent = message;
                errorMessage.classList.remove('hidden');
                errorMessage.classList.add('flex');
                showLoading(false);
            } else {
                errorMessage.classList.add('hidden');
                errorMessage.classList.remove('flex');
            }
        }

        window.onload = loadSamplePDF;
    </script>
</body>
</html>
