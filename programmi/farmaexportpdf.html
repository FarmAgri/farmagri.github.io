<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farma Export_PDF - Editor & Stampa</title>
    
    <!-- Configurazione PWA e Manifest inline -->
    <link rel="manifest" id="dynamic-manifest">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="FarmaExport PDF">

    <!-- Tailwind CSS CDN per lo styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- PDF.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

    <!-- FontAwesome per le icone -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- jsPDF per la generazione automatica del PDF e modifiche -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #1e293b;
        }
        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }

        .drag-over {
            border-color: #3b82f6 !important;
            background-color: rgba(59, 130, 246, 0.1) !important;
        }

        /* Campi di testo interattivi posizionati sopra il PDF */
        .pdf-text-input {
            position: absolute;
            background: rgba(255, 255, 255, 0.9);
            border: 1px dashed #3b82f6;
            color: #0f172a;
            font-size: 14px;
            padding: 2px 6px;
            border-radius: 4px;
            outline: none;
            resize: both;
            overflow: hidden;
            z-index: 10;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .pdf-text-input:focus {
            border: 2px solid #2563eb;
            background: #ffffff;
        }

        /* Stili CSS specifici per la Stampa di TUTTE le pagine */
        @media print {
            @page {
                size: auto;
                margin: 5mm;
            }

            html, body {
                width: 100% !important;
                height: auto !important;
                background: white !important;
                color: black !important;
                margin: 0 !important;
                padding: 0 !important;
                overflow: visible !important;
            }

            header, sidebar, #toolbar, #drop-overlay, .no-print, #loading-spinner, footer, #viewer-container {
                display: none !important;
            }

            #print-container {
                display: block !important;
                width: 100% !important;
            }

            .print-page-wrapper {
                display: flex !important;
                flex-direction: column !important;
                align-items: center !important;
                width: 100% !important;
                page-break-after: always !important;
                break-after: page !important;
                margin: 0 auto !important;
                padding: 0 !important;
            }

            .print-header-page {
                width: 98% !important;
                font-family: Arial, sans-serif !important;
                font-size: 8pt !important;
                color: #475569 !important;
                text-align: center !important;
                padding-bottom: 4px !important;
                margin-bottom: 4px !important;
                border-bottom: 1px solid #cbd5e1 !important;
                text-transform: uppercase !important;
                letter-spacing: 0.5px !important;
            }

            .print-header-page strong {
                color: #0f172a !important;
                font-weight: bold !important;
            }

            .print-page-wrapper canvas {
                display: block !important;
                width: 98% !important;
                height: auto !important;
                max-width: 100% !important;
                margin: 0 auto !important;
                object-fit: contain !important;
            }
        }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden bg-slate-900">

    <div id="print-container" style="display: none;"></div>

    <!-- HEADER / TOOLBAR -->
    <header class="bg-slate-800 border-b border-slate-700 px-4 py-2.5 flex flex-wrap items-center justify-between gap-3 shadow-lg z-20 no-print">
        
        <div class="flex items-center gap-3">
            <div class="flex items-center gap-2 text-blue-500 font-bold text-lg">
                <i class="fa-solid fa-file-pdf text-2xl text-red-500"></i>
                <span class="hidden sm:inline text-white">FARMA EXPORT<span class="text-blue-400">PDF</span></span>
            </div>
            
            <label class="cursor-pointer bg-blue-600 hover:bg-blue-500 text-white text-xs sm:text-sm font-medium py-1.5 px-3 rounded-lg transition-all flex items-center gap-2 shadow-sm">
                <i class="fa-solid fa-folder-open"></i>
                <span>Apri PDF</span>
                <input type="file" id="file-input" accept="application/pdf" class="hidden">
            </label>

            <button id="btn-sample" title="Carica PDF di Esempio" class="bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs sm:text-sm py-1.5 px-3 rounded-lg transition-all flex items-center gap-1.5 border border-slate-600">
                <i class="fa-solid fa-vial text-blue-400"></i>
                <span class="hidden md:inline">Esempio</span>
            </button>

            <!-- Strumento Modifica / Aggiungi Testo -->
            <button id="btn-add-text" title="Clicca sul PDF per aggiungere un campo di testo" class="bg-amber-600 hover:bg-amber-500 text-white text-xs sm:text-sm font-medium py-1.5 px-3 rounded-lg transition-all flex items-center gap-2 shadow-sm">
                <i class="fa-solid fa-pen-to-square"></i>
                <span>Modifica / Scrivi</span>
            </button>

            <!-- Pulsante Salva PDF Modificato -->
            <button id="btn-save-pdf" title="Salva PDF con le modifiche" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs sm:text-sm font-medium py-1.5 px-3 rounded-lg transition-all flex items-center gap-2 shadow-sm">
                <i class="fa-solid fa-floppy-disk"></i>
                <span>Salva Modifiche</span>
            </button>

            <button id="btn-install" title="Scarica come Applicazione Web App" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs sm:text-sm font-medium py-1.5 px-3 rounded-lg transition-all flex items-center gap-2 shadow-sm">
                <i class="fa-solid fa-download"></i>
                <span class="hidden sm:inline">Scarica App</span>
            </button>
        </div>

        <!-- Controlli di Navigazione Pagine -->
        <div class="flex items-center bg-slate-900 border border-slate-700 rounded-lg p-1 text-slate-300">
            <button id="btn-first" title="Prima Pagina" class="p-1.5 hover:bg-slate-800 rounded text-slate-400 hover:text-white transition disabled:opacity-40">
                <i class="fa-solid fa-backward-step"></i>
            </button>
            <button id="btn-prev" title="Pagina Precedente" class="p-1.5 hover:bg-slate-800 rounded text-slate-400 hover:text-white transition disabled:opacity-40">
                <i class="fa-solid fa-chevron-left"></i>
            </button>
            
            <div class="flex items-center px-2 text-xs sm:text-sm font-medium gap-1">
                <input type="number" id="page-num-input" value="1" min="1" class="w-10 bg-slate-800 border border-slate-600 text-center rounded text-white focus:outline-none focus:border-blue-500 py-0.5">
                <span class="text-slate-500">/</span>
                <span id="page-count" class="text-slate-400">--</span>
            </div>

            <button id="btn-next" title="Pagina Successiva" class="p-1.5 hover:bg-slate-800 rounded text-slate-400 hover:text-white transition disabled:opacity-40">
                <i class="fa-solid fa-chevron-right"></i>
            </button>
            <button id="btn-last" title="Ultima Pagina" class="p-1.5 hover:bg-slate-800 rounded text-slate-400 hover:text-white transition disabled:opacity-40">
                <i class="fa-solid fa-forward-step"></i>
            </button>
        </div>

        <!-- Controlli Zoom, Rotazione e Stampa -->
        <div class="flex items-center gap-1.5 sm:gap-2">
            <div class="flex items-center bg-slate-900 border border-slate-700 rounded-lg p-1 text-slate-300">
                <button id="btn-zoom-out" title="Riduci Zoom" class="p-1.5 hover:bg-slate-800 rounded text-slate-400 hover:text-white transition">
                    <i class="fa-solid fa-magnifying-glass-minus"></i>
                </button>
                <span id="zoom-value" class="px-2 text-xs font-mono text-slate-300 min-w-[3rem] text-center">100%</span>
                <button id="btn-zoom-in" title="Aumenta Zoom" class="p-1.5 hover:bg-slate-800 rounded text-slate-400 hover:text-white transition">
                    <i class="fa-solid fa-magnifying-glass-plus"></i>
                </button>
                <button id="btn-zoom-reset" title="Adatta Larghezza" class="p-1.5 hover:bg-slate-800 rounded text-slate-400 hover:text-white transition border-l border-slate-700 ml-1">
                    <i class="fa-solid fa-expand"></i>
                </button>
            </div>

            <button id="btn-rotate" title="Ruota di 90°" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 p-2 rounded-lg text-slate-300 hover:text-white transition">
                <i class="fa-solid fa-rotate-right"></i>
            </button>

            <button id="btn-print" title="Stampa Tutte le Pagine" class="bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-1.5 px-3 rounded-lg transition shadow-sm flex items-center gap-2 text-xs sm:text-sm">
                <i class="fa-solid fa-print"></i>
                <span class="hidden sm:inline">Stampa Tutto</span>
            </button>
        </div>
    </header>

    <!-- CONTENITORE PRINCIPALE VIEWER -->
    <main id="viewer-container" class="relative flex-1 bg-slate-950 overflow-auto flex justify-center items-start p-4 sm:p-8">
        
        <div id="drop-overlay" class="absolute inset-4 border-2 border-dashed border-slate-600 rounded-2xl flex flex-col items-center justify-center bg-slate-900/90 z-10 transition-all pointer-events-none opacity-0">
            <i class="fa-solid fa-cloud-arrow-up text-5xl text-blue-500 mb-3 animate-bounce"></i>
            <p class="text-lg font-semibold text-white">Rilascia il file PDF qui</p>
            <p class="text-sm text-slate-400 mt-1">Verrà caricato e visualizzato all'istante</p>
        </div>

        <div id="loading-spinner" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-900/80 z-20 backdrop-blur-sm">
            <div class="w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mb-4"></div>
            <p id="loading-text" class="text-slate-300 font-medium text-sm">Caricamento documento...</p>
        </div>

        <div id="error-message" class="hidden absolute inset-0 flex-col items-center justify-center bg-slate-900 z-20 p-4 text-center">
            <div class="bg-red-500/10 border border-red-500/30 p-6 rounded-2xl max-w-md">
                <i class="fa-solid fa-triangle-exclamation text-4xl text-red-500 mb-3"></i>
                <h3 class="text-lg font-bold text-white mb-2">Impossibile aprire il file</h3>
                <p id="error-text" class="text-sm text-slate-300 mb-4">Assicurati che il file selezionato sia un PDF valido.</p>
                <button onclick="document.getElementById('file-input').click()" class="bg-red-600 hover:bg-red-500 text-white font-medium py-2 px-4 rounded-lg text-sm transition">
                    Seleziona un altro file
                </button>
            </div>
        </div>

        <div id="canvas-wrapper" class="relative shadow-2xl transition-all duration-150 my-auto cursor-default">
            <canvas id="pdf-canvas" class="block bg-white rounded shadow-2xl"></canvas>
            <!-- Contenitore dei campi di testo inseriti dall'utente -->
            <div id="annotations-layer" class="absolute inset-0 pointer-events-none"></div>
        </div>
    </main>

    <!-- BARRA DI STATO INFERIORE -->
    <footer class="bg-slate-800 border-t border-slate-700 px-4 py-1.5 text-xs text-slate-400 flex justify-between items-center no-print">
        <div class="flex items-center gap-2 truncate max-w-md">
            <i class="fa-solid fa-file text-slate-500"></i>
            <span id="file-name" class="truncate font-mono">nessun_file.pdf</span>
        </div>
        <div class="flex items-center gap-4">
            <span id="pdf-info" class="hidden sm:inline">Farma Export PDF Editor</span>
            <span class="text-slate-600">|</span>
            <span class="text-slate-500">Pronto</span>
        </div>
    </footer>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        const state = {
            pdfDoc: null,
            pageNum: 1,
            pageRendering: false,
            pageNumPending: null,
            scale: 1.25,
            rotation: 0,
            fileName: 'Esempio.pdf',
            isEditMode: false,
            annotations: {}
        };

        const canvas = document.getElementById('pdf-canvas');
        const ctx = canvas.getContext('2d');
        const canvasWrapper = document.getElementById('canvas-wrapper');
        const annotationsLayer = document.getElementById('annotations-layer');
        const pageNumInput = document.getElementById('page-num-input');
        const pageCountEl = document.getElementById('page-count');
        const zoomValueEl = document.getElementById('zoom-value');
        const fileNameEl = document.getElementById('file-name');
        const loadingSpinner = document.getElementById('loading-spinner');
        const loadingText = document.getElementById('loading-text');
        const errorMessage = document.getElementById('error-message');
        const errorText = document.getElementById('error-text');
        const dropOverlay = document.getElementById('drop-overlay');
        const viewerContainer = document.getElementById('viewer-container');

        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');
        const btnFirst = document.getElementById('btn-first');
        const btnLast = document.getElementById('btn-last');
        const btnZoomIn = document.getElementById('btn-zoom-in');
        const btnZoomOut = document.getElementById('btn-zoom-out');
        const btnZoomReset = document.getElementById('btn-zoom-reset');
        const btnRotate = document.getElementById('btn-rotate');
        const btnPrint = document.getElementById('btn-print');
        const btnAddText = document.getElementById('btn-add-text');
        const btnSavePdf = document.getElementById('btn-save-pdf');
        const btnSample = document.getElementById('btn-sample');
        const btnInstall = document.getElementById('btn-install');
        const fileInput = document.getElementById('file-input');

        // Configurazione e Registrazione PWA Automatica tramite Blob Data URL
        const manifestData = {
            name: "Farma Export PDF Editor",
            short_name: "FarmaExportPDF",
            start_url: window.location.href,
            display: "standalone",
            background_color: "#0f172a",
            theme_color: "#0f172a",
            icons: [
                {
                    src: "https://cdn-icons-png.flaticon.com/512/337/337946.png",
                    sizes: "512x512",
                    type: "image/png"
                }
            ]
        };
        const manifestBlob = new Blob([JSON.stringify(manifestData)], { type: 'application/json' });
        document.getElementById('dynamic-manifest').href = URL.createObjectURL(manifestBlob);

        // Registrazione Service Worker per cache e supporto offline
        if ('serviceWorker' in navigator) {
            const swCode = `
                self.addEventListener('install', (e) => { self.skipWaiting(); });
                self.addEventListener('activate', (e) => { return self.clients.claim(); });
                self.addEventListener('fetch', (e) => {
                    e.respondWith(fetch(e.request).catch(() => caches.match(e.request)));
                });
            `;
            const swBlob = new Blob([swCode], { type: 'text/javascript' });
            const swUrl = URL.createObjectURL(swBlob);
            navigator.serviceWorker.register(swUrl)
                .then(() => console.log("PWA Service Worker attivo."))
                .catch(err => console.log("Errore Service Worker:", err));
        }

        function renderPage(num) {
            state.pageRendering = true;
            showLoading(true, `Rendering pagina ${num}...`);

            state.pdfDoc.getPage(num).then(page => {
                const viewport = page.getViewport({ scale: state.scale, rotation: state.rotation });
                const outputScale = window.devicePixelRatio || 1;
                canvas.width = Math.floor(viewport.width * outputScale);
                canvas.height = Math.floor(viewport.height * outputScale);
                
                canvas.style.width = Math.floor(viewport.width) + "px";
                canvas.style.height = Math.floor(viewport.height) + "px";

                const transform = outputScale !== 1 ? [outputScale, 0, 0, outputScale, 0, 0] : null;

                const renderContext = {
                    canvasContext: ctx,
                    transform: transform,
                    viewport: viewport
                };

                page.render(renderContext).promise.then(() => {
                    state.pageRendering = false;
                    showLoading(false);
                    renderAnnotationsForCurrentPage();

                    if (state.pageNumPending !== null) {
                        const nextNum = state.pageNumPending;
                        state.pageNumPending = null;
                        renderPage(nextNum);
                    }
                }).catch(err => {
                    console.error('Errore rendering:', err);
                    state.pageRendering = false;
                    showLoading(false);
                });
            }).catch(err => {
                console.error('Errore pagina:', err);
                state.pageRendering = false;
                showLoading(false);
            });

            pageNumInput.value = num;
            updateControlsState();
        }

        function queueRenderPage(num) {
            if (state.pageRendering) {
                state.pageNumPending = num;
            } else {
                renderPage(num);
            }
        }

        function updateControlsState() {
            if (!state.pdfDoc) return;
            const isFirst = state.pageNum <= 1;
            const isLast = state.pageNum >= state.pdfDoc.numPages;

            btnPrev.disabled = isFirst;
            btnFirst.disabled = isFirst;
            btnNext.disabled = isLast;
            btnLast.disabled = isLast;

            zoomValueEl.textContent = `${Math.round(state.scale * 100)}%`;
        }

        function loadPDFData(data, name = 'documento.pdf') {
            showError(false);
            showLoading(true, 'Caricamento PDF...');
            state.fileName = name;
            fileNameEl.textContent = name;
            state.annotations = {};
            state.pageRendering = false;
            state.pageNumPending = null;

            pdfjsLib.getDocument(data).promise.then(pdfDoc_ => {
                state.pdfDoc = pdfDoc_;
                state.pageNum = 1;
                state.rotation = 0;
                pageCountEl.textContent = state.pdfDoc.numPages;
                pageNumInput.max = state.pdfDoc.numPages;
                
                renderPage(state.pageNum);
            }).catch(err => {
                console.error('Errore caricamento PDF:', err);
                state.pageRendering = false;
                showLoading(false);
                showError(true, 'Impossibile leggere il file PDF.');
            });
        }

        function loadSamplePDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            doc.setFillColor(30, 41, 59);
            doc.rect(0, 0, 210, 297, 'F');
            
            doc.setTextColor(59, 130, 246);
            doc.setFontSize(24);
            doc.text("Documento PDF Modificabile", 20, 30);

            doc.setTextColor(241, 245, 249);
            doc.setFontSize(14);
            doc.text("Clicca su 'Modifica / Scrivi' e poi sul foglio per aggiungere testo!", 20, 45);

            doc.addPage();
            doc.setFillColor(15, 23, 42);
            doc.rect(0, 0, 210, 297, 'F');
            doc.setTextColor(59, 130, 246);
            doc.setFontSize(24);
            doc.text("Seconda Pagina", 20, 30);

            const pdfArrayBuffer = doc.output('arraybuffer');
            loadPDFData(pdfArrayBuffer, 'Esempio_Modificabile.pdf');
        }

        // Attivazione modalità scrittura/modifica
        btnAddText.addEventListener('click', () => {
            state.isEditMode = !state.isEditMode;
            if (state.isEditMode) {
                btnAddText.classList.remove('bg-amber-600', 'hover:bg-amber-500');
                btnAddText.classList.add('bg-green-600', 'hover:bg-green-500', 'ring-2', 'ring-white');
                canvasWrapper.style.cursor = 'crosshair';
            } else {
                btnAddText.classList.remove('bg-green-600', 'hover:bg-green-500', 'ring-2', 'ring-white');
                btnAddText.classList.add('bg-amber-600', 'hover:bg-amber-500');
                canvasWrapper.style.cursor = 'default';
            }
        });

        // Click sul canvas per aggiungere una casella di testo
        canvasWrapper.addEventListener('click', (e) => {
            if (!state.isEditMode || !state.pdfDoc) return;
            if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;

            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            if (x < 0 || y < 0 || x > canvas.width || y > canvas.height) return;

            if (!state.annotations[state.pageNum]) {
                state.annotations[state.pageNum] = [];
            }

            state.annotations[state.pageNum].push({
                x: x,
                y: y,
                text: '',
                width: 150,
                height: 30
            });

            renderAnnotationsForCurrentPage();
        });

        function renderAnnotationsForCurrentPage() {
            annotationsLayer.innerHTML = '';
            const annos = state.annotations[state.pageNum] || [];

            annos.forEach((anno) => {
                const input = document.createElement('textarea');
                input.className = 'pdf-text-input pointer-events-auto';
                input.style.left = `${anno.x}px`;
                input.style.top = `${anno.y}px`;
                input.style.width = `${anno.width}px`;
                input.style.height = `${anno.height}px`;
                input.value = anno.text;
                input.placeholder = 'Scrivi qui...';

                input.addEventListener('input', (e) => {
                    anno.text = e.target.value;
                });

                input.addEventListener('mouseup', () => {
                    anno.width = parseFloat(input.style.width) || anno.width;
                    anno.height = parseFloat(input.style.height) || anno.height;
                });

                annotationsLayer.appendChild(input);
            });
        }

        // Stampa di tutte le pagine
        btnPrint.addEventListener('click', async () => {
            if (!state.pdfDoc) return;
            
            showLoading(true, 'Preparazione stampa...');
            const printContainer = document.getElementById('print-container');
            printContainer.innerHTML = '';

            try {
                for (let i = 1; i <= state.pdfDoc.numPages; i++) {
                    const page = await state.pdfDoc.getPage(i);
                    const viewport = page.getViewport({ scale: 2.0, rotation: state.rotation });

                    const pageWrapper = document.createElement('div');
                    pageWrapper.className = 'print-page-wrapper';

                    const headerDiv = document.createElement('div');
                    headerDiv.className = 'print-header-page';
                    headerDiv.innerHTML = `<strong>FARMA EXPORT PDF</strong> &nbsp;—&nbsp; Documento Stampato`;
                    
                    const pCanvas = document.createElement('canvas');
                    const pCtx = pCanvas.getContext('2d');
                    pCanvas.width = viewport.width;
                    pCanvas.height = viewport.height;

                    await page.render({
                        canvasContext: pCtx,
                        viewport: viewport
                    }).promise;

                    const annos = state.annotations[i] || [];
                    annos.forEach(anno => {
                        if (anno.text.trim() !== '') {
                            const ratio = 2.0 / state.scale;
                            pCtx.font = `${14 * ratio}px Inter, sans-serif`;
                            pCtx.fillStyle = '#0f172a';
                            pCtx.fillText(anno.text, anno.x * ratio, (anno.y + 18) * ratio);
                        }
                    });

                    pageWrapper.appendChild(headerDiv);
                    pageWrapper.appendChild(pCanvas);
                    printContainer.appendChild(pageWrapper);
                }

                showLoading(false);
                window.print();
            } catch (err) {
                console.error('Errore stampa:', err);
                showLoading(false);
                alert('Errore durante la preparazione della stampa.');
            }
        });

        // Salvataggio PDF modificato
        btnSavePdf.addEventListener('click', async () => {
            if (!state.pdfDoc) return;
            showLoading(true, 'Generazione PDF...');

            try {
                const { jsPDF } = window.jspdf;
                let pdfDocJs = null;

                for (let i = 1; i <= state.pdfDoc.numPages; i++) {
                    const page = await state.pdfDoc.getPage(i);
                    const viewport = page.getViewport({ scale: 1.5, rotation: state.rotation });
                    
                    const tmpCanvas = document.createElement('canvas');
                    const tmpCtx = tmpCanvas.getContext('2d');
                    tmpCanvas.width = viewport.width;
                    tmpCanvas.height = viewport.height;

                    await page.render({ canvasContext: tmpCtx, viewport: viewport }).promise;

                    const annos = state.annotations[i] || [];
                    annos.forEach(anno => {
                        if (anno.text.trim() !== '') {
                            const ratio = 1.5 / state.scale;
                            tmpCtx.font = `${14 * ratio}px Inter, sans-serif`;
                            tmpCtx.fillStyle = '#0f172a';
                            tmpCtx.fillText(anno.text, anno.x * ratio, (anno.y + 18) * ratio);
                        }
                    });

                    const imgData = tmpCanvas.toDataURL('image/jpeg', 0.95);
                    const pdfW = viewport.width / 1.5 * 0.352778;
                    const pdfH = viewport.height / 1.5 * 0.352778;

                    if (i === 1) {
                        pdfDocJs = new jsPDF({
                            orientation: pdfW > pdfH ? 'landscape' : 'portrait',
                            unit: 'mm',
                            format: [pdfW, pdfH]
                        });
                    } else {
                        pdfDocJs.addPage([pdfW, pdfH], pdfW > pdfH ? 'landscape' : 'portrait');
                    }

                    pdfDocJs.addImage(imgData, 'JPEG', 0, 0, pdfW, pdfH);
                }

                showLoading(false);
                pdfDocJs.save(`Modificato_${state.fileName}`);
            } catch (err) {
                console.error('Errore salvataggio:', err);
                showLoading(false);
                alert('Errore durante il salvataggio del PDF.');
            }
        });

        // Funzione di Download PWA (Scarica App)
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
        });

        btnInstall.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    console.log('App installata correttamente.');
                }
                deferredPrompt = null;
            } else {
                // Fallback: scarica il pacchetto PWA standalone pronto all'uso in locale
                const htmlContent = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
                const blob = new Blob([htmlContent], { type: 'text/html' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'FarmaExportPDF_App.html';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                
                alert("Applicazione scaricata con successo! Aprila direttamente dal tuo PC o smartphone per usarla come Web App offline.");
            }
        });

        btnPrev.addEventListener('click', () => {
            if (state.pageNum <= 1) return;
            state.pageNum--;
            queueRenderPage(state.pageNum);
        });

        btnNext.addEventListener('click', () => {
            if (state.pageNum >= state.pdfDoc.numPages) return;
            state.pageNum++;
            queueRenderPage(state.pageNum);
        });

        btnFirst.addEventListener('click', () => {
            if (state.pageNum === 1) return;
            state.pageNum = 1;
            queueRenderPage(state.pageNum);
        });

        btnLast.addEventListener('click', () => {
            if (state.pageNum === state.pdfDoc.numPages) return;
            state.pageNum = state.pdfDoc.numPages;
            queueRenderPage(state.pageNum);
        });

        pageNumInput.addEventListener('change', (e) => {
            let val = parseInt(e.target.value);
            if (isNaN(val) || val < 1) val = 1;
            if (val > state.pdfDoc.numPages) val = state.pdfDoc.numPages;
            state.pageNum = val;
            queueRenderPage(state.pageNum);
        });

        btnZoomIn.addEventListener('click', () => {
            if (state.scale >= 3.0) return;
            state.scale += 0.25;
            queueRenderPage(state.pageNum);
        });

        btnZoomOut.addEventListener('click', () => {
            if (state.scale <= 0.5) return;
            state.scale -= 0.25;
            queueRenderPage(state.pageNum);
        });

        btnZoomReset.addEventListener('click', () => {
            const containerWidth = viewerContainer.clientWidth - 64;
            state.pdfDoc.getPage(state.pageNum).then(page => {
                const unscaledViewport = page.getViewport({ scale: 1, rotation: state.rotation });
                state.scale = containerWidth / unscaledViewport.width;
                if (state.scale < 0.5) state.scale = 0.5;
                if (state.scale > 2.5) state.scale = 2.5;
                queueRenderPage(state.pageNum);
            });
        });

        btnRotate.addEventListener('click', () => {
            state.rotation = (state.rotation + 90) % 360;
            queueRenderPage(state.pageNum);
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                loadPDFData(evt.target.result, file.name);
            };
            reader.readAsArrayBuffer(file);
        });

        btnSample.addEventListener('click', () => {
            loadSamplePDF();
        });

        ['dragenter', 'dragover'].forEach(eventName => {
            viewerContainer.addEventListener(eventName, (e) => {
                e.preventDefault();
                e.stopPropagation();
                dropOverlay.classList.remove('opacity-0', 'pointer-events-none');
                dropOverlay.classList.add('opacity-100');
            }, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            viewerContainer.addEventListener(eventName, (e) => {
                e.preventDefault();
                e.stopPropagation();
                dropOverlay.classList.add('opacity-0', 'pointer-events-none');
                dropOverlay.classList.remove('opacity-100');
            }, false);
        });

        viewerContainer.addEventListener('drop', (e) => {
            const dt = e.dataTransfer;
            const files = dt.files;

            if (files && files.length > 0) {
                const file = files[0];
                const reader = new FileReader();
                reader.onload = function(evt) {
                    loadPDFData(evt.target.result, file.name);
                };
                reader.readAsArrayBuffer(file);
            }
        });

        function showLoading(show, text = 'Caricamento...') {
            if (show) {
                loadingText.textContent = text;
                loadingSpinner.classList.remove('hidden');
                loadingSpinner.classList.add('flex');
            } else {
                loadingSpinner.classList.add('hidden');
                loadingSpinner.classList.remove('flex');
            }
        }

        function showError(show, message = '') {
            if (show) {
                errorText.textContent = message;
                errorMessage.classList.remove('hidden');
                errorMessage.classList.add('flex');
                showLoading(false);
            } else {
                errorMessage.classList.add('hidden');
                errorMessage.classList.remove('flex');
            }
        }

        window.onload = function() {
            loadSamplePDF();
        };
    </script>
</body>
</html>
