<!DOCTYPE html>
<html lang="it" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Farma Export - PDF Editor Interattivo</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Roboto+Mono&family=Times+New+Roman&display=swap" rel="stylesheet">

  <!-- PDF.js library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <!-- jsPDF library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdf4',
              500: '#22c55e',
              600: '#16a34a',
              700: '#15803d',
              800: '#166534',
              900: '#14532d',
            }
          }
        }
      }
    }
  </script>

  <style>
    /* Custom Scrollbars */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }

    /* Editable Text Box overlay styling */
    .text-block-wrapper {
      position: absolute;
      box-sizing: border-box;
      user-select: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
      cursor: move;
    }

    .text-block-wrapper:hover {
      outline: 1px dashed rgba(34, 197, 94, 0.5);
    }

    .text-block-wrapper.selected {
      outline: 1.5px solid #22c55e;
      box-shadow: 0 0 8px rgba(34, 197, 94, 0.3);
    }

    .transparent-input {
      background: transparent !important;
      border: none !important;
      outline: none !important;
      width: 100%;
      height: 100%;
      padding: 0;
      margin: 0;
      resize: none;
      overflow: hidden;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.1;
      box-sizing: border-box;
    }

    .transparent-input:focus {
      outline: none !important;
    }

    /* Print styling */
    @media print {
      body * {
        visibility: hidden;
      }
      #print-area, #print-area * {
        visibility: visible;
      }
      #print-area {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
      }
    }
  </style>
</head>
<body class="h-full flex flex-col font-['Inter',sans-serif] bg-slate-950 text-slate-100 overflow-hidden select-none">

  <!-- TOP NAVBAR -->
  <header class="h-16 bg-slate-900 border-b border-slate-800 flex items-center justify-between px-4 z-30 shrink-0">
    <div class="flex items-center space-x-3">
      <div class="w-9 h-9 bg-brand-600 rounded-lg flex items-center justify-center font-bold text-white text-lg shadow-lg shadow-brand-600/30">
        FE
      </div>
      <div>
        <h1 class="font-bold text-base tracking-wide text-white flex items-center gap-2">
          Farma Export <span class="text-xs bg-brand-900/80 text-brand-500 border border-brand-500/30 px-2 py-0.5 rounded-full font-semibold">PDF Editor</span>
        </h1>
        <p class="text-xs text-slate-400" id="file-name-display">Nessun documento caricato</p>
      </div>
    </div>

    <!-- MAIN ACTIONS -->
    <div class="flex items-center space-x-2">
      <label class="cursor-pointer bg-slate-800 hover:bg-slate-700 text-slate-200 px-3.5 py-1.5 rounded-lg border border-slate-700 flex items-center gap-2 text-xs font-medium transition-all shadow-sm">
        <i class="fa-solid fa-folder-open text-brand-500">
</i> Apri PDF
        <input type="file" id="pdf-file-input" accept="application/pdf" class="hidden">
      </label>

      <label class="cursor-pointer bg-slate-800 hover:bg-slate-700 text-slate-200 px-3.5 py-1.5 rounded-lg border border-slate-700 flex items-center gap-2 text-xs font-medium transition-all shadow-sm">
        <i class="fa-solid fa-file-image text-blue-400">
</i> Immagini in PDF
        <input type="file" id="img-file-input" accept="image/*" multiple class="hidden">
      </label>

      <div class="h-6 w-px bg-slate-800 mx-1">
</div>

      <button id="btn-print" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-lg border border-slate-700 flex items-center gap-2 text-xs font-medium transition-all">
        <i class="fa-solid fa-print">
</i> Stampa
      </button>

      <button id="btn-export" class="bg-brand-600 hover:bg-brand-500 text-white px-4 py-1.5 rounded-lg flex items-center gap-2 text-xs font-semibold shadow-md shadow-brand-600/20 transition-all">
        <i class="fa-solid fa-download">
</i> Salva PDF
      </button>
    </div>
  </header>

  <!-- SECONDARY TOOLBAR: FORMATTING & PAGE CONTROLS -->
  <div class="bg-slate-900/90 border-b border-slate-800/80 px-4 py-2 flex flex-wrap items-center justify-between gap-3 z-20 shrink-0 text-xs backdrop-blur">
    
    <!-- FORMATTING TOOLBAR -->
    <div class="flex items-center space-x-1.5 bg-slate-950/60 p-1 rounded-lg border border-slate-800">
      <span class="text-slate-400 px-2 font-medium text-[11px] flex items-center gap-1">
        <i class="fa-solid fa-font text-slate-500">
</i> Formattazione:
      </span>
      
      <!-- Font Family -->
      <select id="font-family" class="bg-slate-900 border border-slate-700 rounded px-2 py-1 text-slate-200 text-xs focus:ring-1 focus:ring-brand-500 outline-none">
        <option value="Inter, sans-serif">Inter</option>
        <option value="Arial, sans-serif">Arial</option>
        <option value="'Times New Roman', serif">Times New Roman</option>
        <option value="'Courier New', monospace">Courier New</option>
        <option value="Georgia, serif">Georgia</option>
        <option value="Helvetica, sans-serif">Helvetica</option>
      </select>

      <!-- Font Size -->
      <div class="flex items-center border border-slate-700 rounded bg-slate-900">
        <input type="number" id="font-size" value="14" min="6" max="120" class="w-12 bg-transparent text-center text-slate-200 py-1 outline-none text-xs">
        <span class="text-slate-500 pr-1.5 text-[10px]">px</span>
      </div>

      <!-- Bold / Italic / Underline -->
      <button id="btn-bold" class="w-7 h-7 flex items-center justify-center rounded hover:bg-slate-800 text-slate-300 border border-transparent font-bold hover:border-slate-700 transition">B</button>
      <button id="btn-italic" class="w-7 h-7 flex items-center justify-center rounded hover:bg-slate-800 text-slate-300 border border-transparent italic hover:border-slate-700 transition">I</button>
      <button id="btn-underline" class="w-7 h-7 flex items-center justify-center rounded hover:bg-slate-800 text-slate-300 border border-transparent underline hover:border-slate-700 transition">U</button>

      <!-- Text Color -->
      <div class="relative w-7 h-7 flex items-center justify-center rounded border border-slate-700 overflow-hidden cursor-pointer bg-slate-900" title="Colore Testo">
        <input type="color" id="text-color" value="#000000" class="absolute -top-2 -left-2 w-12 h-12 cursor-pointer border-0">
      </div>

      <div class="h-4 w-px bg-slate-800 mx-1">
</div>

      <!-- Add New Text Mode Toggle -->
      <button id="btn-add-text" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 px-2.5 py-1 rounded flex items-center gap-1.5 text-xs transition">
        <i class="fa-solid fa-plus text-brand-500">
</i> Inserisci Testo
      </button>
    </div>

    <!-- PAGE VIEW & NAVIGATION CONTROLS -->
    <div class="flex items-center space-x-3">
      <!-- Page Navigation -->
      <div class="flex items-center space-x-1 bg-slate-950/60 p-1 rounded-lg border border-slate-800">
        <button id="btn-prev-page" class="w-7 h-7 flex items-center justify-center rounded hover:bg-slate-800 text-slate-300 disabled:opacity-40">
          <i class="fa-solid fa-chevron-left">
</i>
        </button>
        <span class="text-slate-300 font-medium px-2 text-xs">
          Pagina <span id="current-page-num">0</span> / <span id="total-pages-num">0</span>
        </span>
        <button id="btn-next-page" class="w-7 h-7 flex items-center justify-center rounded hover:bg-slate-800 text-slate-300 disabled:opacity-40">
          <i class="fa-solid fa-chevron-right">
</i>
        </button>
      </div>

      <!-- Zoom Controls -->
      <div class="flex items-center space-x-1 bg-slate-950/60 p-1 rounded-lg border border-slate-800">
        <button id="btn-zoom-out" class="w-7 h-7 flex items-center justify-center rounded hover:bg-slate-800 text-slate-300">
          <i class="fa-solid fa-minus">
</i>
        </button>
        <span id="zoom-level-text" class="text-slate-300 font-medium w-12 text-center text-xs">100%</span>
        <button id="btn-zoom-in" class="w-7 h-7 flex items-center justify-center rounded hover:bg-slate-800 text-slate-300">
          <i class="fa-solid fa-plus">
</i>
        </button>
      </div>

      <!-- Rotation Controls -->
      <button id="btn-rotate" class="bg-slate-950/60 hover:bg-slate-800 text-slate-300 p-1.5 rounded-lg border border-slate-800 transition" title="Ruota Pagina">
        <i class="fa-solid fa-rotate-right text-slate-400">
</i>
      </button>
    </div>
  </div>

  <!-- MAIN WORKSPACE -->
  <main class="flex-1 bg-slate-950 relative overflow-auto p-8 flex justify-center items-start" id="workspace">
    
    <!-- EMPTY STATE -->
    <div id="empty-state" class="m-auto text-center py-20 px-6 max-w-md border-2 border-dashed border-slate-800 rounded-2xl bg-slate-900/40">
      <div class="w-16 h-16 bg-slate-800 rounded-full flex items-center justify-center mx-auto mb-4 text-brand-500 text-2xl shadow-inner">
        <i class="fa-solid fa-file-pdf">
</i>
      </div>
      <h3 class="text-lg font-bold text-slate-200 mb-2">Nessun file aperto</h3>
      <p class="text-slate-400 text-xs mb-6">Carica un file PDF per estrarre e modificare direttamente il testo nativo senza sovrapposizioni opache.</p>
      <div class="flex flex-col gap-3">
        <button id="btn-empty-upload" class="w-full bg-brand-600 hover:bg-brand-500 text-white font-semibold py-2.5 px-4 rounded-xl text-xs transition shadow-lg shadow-brand-600/20 flex items-center justify-center gap-2">
          <i class="fa-solid fa-upload">
</i> Seleziona PDF
        </button>
      </div>
    </div>

    <!-- CANVAS & OVERLAY CONTAINER -->
    <div id="pdf-container" class="relative hidden shadow-2xl rounded-sm bg-white overflow-hidden transition-all duration-200">
      <!-- PDF Rendering Canvas -->
      <canvas id="pdf-canvas" class="block w-full h-full"></canvas>
      
      <!-- Interactive Transparent Overlay Layer -->
      <div id="text-overlay" class="absolute inset-0 z-10 overflow-hidden cursor-crosshair"></div>
    </div>
  </main>

  <!-- PRINT CONTAINER (Hidden) -->
  <div id="print-area" class="hidden"></div>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    // Initialize PDF.js worker
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    // APP STATE
    const state = {
      pdfDoc: null,
      pageNum: 1,
      totalPages: 0,
      zoom: 1.2,
      rotation: 0,
      fileName: 'documento.pdf',
      activeTextBlock: null,
      isAddingTextMode: false,
      // Store modified/deleted items per page to redraw covers
      // Structure: { pageNum: [ { id, originalRect, newText, style, isCovered } ] }
      pageTextBlocks: {},
      viewport: null,
      isDragging: false,
      dragOffset: { x: 0, y: 0 }
    };

    // DOM ELEMENTS
    const pdfFileInput = document.getElementById('pdf-file-input');
    const imgFileInput = document.getElementById('img-file-input');
    const pdfCanvas = document.getElementById('pdf-canvas');
    const ctx = pdfCanvas.getContext('2d');
    const textOverlay = document.getElementById('text-overlay');
    const pdfContainer = document.getElementById('pdf-container');
    const emptyState = document.getElementById('empty-state');
    const fileNameDisplay = document.getElementById('file-name-display');
    const currentPageNumEl = document.getElementById('current-page-num');
    const totalPagesNumEl = document.getElementById('total-pages-num');
    const zoomLevelText = document.getElementById('zoom-level-text');

    // Formatting Controls
    const fontFamilySelect = document.getElementById('font-family');
    const fontSizeInput = document.getElementById('font-size');
    const btnBold = document.getElementById('btn-bold');
    const btnItalic = document.getElementById('btn-italic');
    const btnUnderline = document.getElementById('btn-underline');
    const textColorInput = document.getElementById('text-color');
    const btnAddText = document.getElementById('btn-add-text');

    // Initialize formatting options defaults
    const currentStyle = {
      fontFamily: 'Inter, sans-serif',
      fontSize: 14,
      bold: false,
      italic: false,
      underline: false,
      color: '#000000'
    };

    // EVENT LISTENERS - FILE LOADING
    pdfFileInput.addEventListener('change', handlePdfFileUpload);
    imgFileInput.addEventListener('change', handleImgFileUpload);
    document.getElementById('btn-empty-upload').addEventListener('click', () => pdfFileInput.click());

    // Navigation & Zoom Listeners
    document.getElementById('btn-prev-page').addEventListener('click', () => changePage(-1));
    document.getElementById('btn-next-page').addEventListener('click', () => changePage(1));
    document.getElementById('btn-zoom-in').addEventListener('click', () => changeZoom(0.15));
    document.getElementById('btn-zoom-out').addEventListener('click', () => changeZoom(-0.15));
    document.getElementById('btn-rotate').addEventListener('click', rotatePage);

    // Save & Print
    document.getElementById('btn-export').addEventListener('click', exportPDF);
    document.getElementById('btn-print').addEventListener('click', printDocument);

    // Formatting Controls Sync
    fontFamilySelect.addEventListener('change', (e) => updateActiveTextProperty('fontFamily', e.target.value));
    fontSizeInput.addEventListener('change', (e) => updateActiveTextProperty('fontSize', parseInt(e.target.value) || 12));
    textColorInput.addEventListener('input', (e) => updateActiveTextProperty('color', e.target.value));

    btnBold.addEventListener('click', () => {
      currentStyle.bold = !currentStyle.bold;
      btnBold.classList.toggle('bg-brand-900/60', currentStyle.bold);
      btnBold.classList.toggle('text-brand-400', currentStyle.bold);
      btnBold.classList.toggle('border-brand-500/50', currentStyle.bold);
      updateActiveTextProperty('bold', currentStyle.bold);
    });

    btnItalic.addEventListener('click', () => {
      currentStyle.italic = !currentStyle.italic;
      btnItalic.classList.toggle('bg-brand-900/60', currentStyle.italic);
      btnItalic.classList.toggle('text-brand-400', currentStyle.italic);
      btnItalic.classList.toggle('border-brand-500/50', currentStyle.italic);
      updateActiveTextProperty('italic', currentStyle.italic);
    });

    btnUnderline.addEventListener('click', () => {
      currentStyle.underline = !currentStyle.underline;
      btnUnderline.classList.toggle('bg-brand-900/60', currentStyle.underline);
      btnUnderline.classList.toggle('text-brand-400', currentStyle.underline);
      btnUnderline.classList.toggle('border-brand-500/50', currentStyle.underline);
      updateActiveTextProperty('underline', currentStyle.underline);
    });

    btnAddText.addEventListener('click', () => {
      state.isAddingTextMode = !state.isAddingTextMode;
      btnAddText.classList.toggle('bg-brand-600', state.isAddingTextMode);
      btnAddText.classList.toggle('text-white', state.isAddingTextMode);
      textOverlay.style.cursor = state.isAddingTextMode ? 'text' : 'crosshair';
    });

    // Add Text on Canvas Click when in Add Text mode
    textOverlay.addEventListener('click', (e) => {
      if (!state.isAddingTextMode) return;
      if (e.target !== textOverlay) return;

      const rect = textOverlay.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      createNewTextBlock(x, y, "Nuovo Testo");
      state.isAddingTextMode = false;
      btnAddText.classList.remove('bg-brand-600', 'text-white');
      textOverlay.style.cursor = 'crosshair';
    });

    // File Handlers
    function handlePdfFileUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      state.fileName = file.name;
      fileNameDisplay.textContent = file.name;

      const reader = new FileReader();
      reader.onload = function (ev) {
        const typedarray = new Uint8Array(ev.target.result);
        pdfjsLib.getDocument(typedarray).promise.then(pdf => {
          state.pdfDoc = pdf;
          state.totalPages = pdf.numPages;
          state.pageNum = 1;
          state.pageTextBlocks = {};
          
          totalPagesNumEl.textContent = state.totalPages;
          emptyState.classList.add('hidden');
          pdfContainer.classList.remove('hidden');

          renderPage(state.pageNum);
        });
      };
      reader.readAsArrayBuffer(file);
    }

    function handleImgFileUpload(e) {
      const files = Array.from(e.target.files);
      if (!files.length) return;

      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF();
      let promises = files.map((file, idx) => {
        return new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = (ev) => {
            const img = new Image();
            img.src = ev.target.result;
            img.onload = () => {
              if (idx > 0) pdf.addPage();
              const pageWidth = pdf.internal.pageSize.getWidth();
              const pageHeight = pdf.internal.pageSize.getHeight();
              
              // Maintain image aspect ratio inside page
              const ratio = Math.min(pageWidth / img.width, pageHeight / img.height);
              const w = img.width * ratio;
              const h = img.height * ratio;
              const x = (pageWidth - w) / 2;
              const y = (pageHeight - h) / 2;

              pdf.addImage(img, 'JPEG', x, y, w, h);
              resolve();
            };
          };
          reader.readAsDataURL(file);
        });
      });

      Promise.all(promises).then(() => {
        const pdfBlob = pdf.output('blob');
        const typedarray = new Uint8Array(pdf.output('arraybuffer'));
        state.fileName = "immagini_convertite.pdf";
        fileNameDisplay.textContent = state.fileName;

        pdfjsLib.getDocument(typedarray).promise.then(pdfDoc => {
          state.pdfDoc = pdfDoc;
          state.totalPages = pdfDoc.numPages;
          state.pageNum = 1;
          state.pageTextBlocks = {};
          totalPagesNumEl.textContent = state.totalPages;

          emptyState.classList.add('hidden');
          pdfContainer.classList.remove('hidden');
          renderPage(state.pageNum);
        });
      });
    }

    // MAIN RENDER ENGINE
    async function renderPage(num) {
      if (!state.pdfDoc) return;
      currentPageNumEl.textContent = num;

      const page = await state.pdfDoc.getPage(num);
      state.viewport = page.getViewport({ scale: state.zoom, rotation: state.rotation });

      // Canvas dimensions
      pdfCanvas.width = state.viewport.width;
      pdfCanvas.height = state.viewport.height;
      pdfContainer.style.width = `${state.viewport.width}px`;
      pdfContainer.style.height = `${state.viewport.height}px`;

      // Clear text overlay
      textOverlay.innerHTML = '';

      // Render PDF Page onto Canvas
      const renderContext = {
        canvasContext: ctx,
        viewport: state.viewport
      };

      await page.render(renderContext).promise;

      // Initialize page blocks array if empty
      if (!state.pageTextBlocks[num]) {
        state.pageTextBlocks[num] = [];
        // Extract native PDF text blocks
        const textContent = await page.getTextContent();
        extractAndBuildTextOverlay(textContent, state.viewport);
      } else {
        // Re-render overlay for existing stored modifications
        rebuildOverlayFromState();
      }

      // Draw white covers over canvas for text blocks that have been modified or erased
      applyCanvasCovers();
    }

    // EXTRACT NATIVE PDF TEXT & CREATE OVERLAY
    function extractAndBuildTextOverlay(textContent, viewport) {
      const items = textContent.items;

      items.forEach((item, index) => {
        if (!item.str || item.str.trim() === '') return;

        // Compute text position matrix mapping from PDF coords to Canvas view
        const tx = pdfjsLib.Util.transform(viewport.transform, item.transform);
        const fontHeight = Math.sqrt(tx[2] * tx[2] + tx[3] * tx[3]);

        const x = tx[4];
        const y = tx[5] - fontHeight; // Position top-left
        const width = item.width * viewport.scale;
        const height = fontHeight * 1.2;

        const blockData = {
          id: `native-${state.pageNum}-${index}-${Date.now()}`,
          isNative: true,
          originalText: item.str,
          text: item.str,
          x: x,
          y: y,
          width: Math.max(width, 20),
          height: Math.max(height, fontHeight),
          style: {
            fontFamily: currentStyle.fontFamily,
            fontSize: Math.round(fontHeight),
            bold: false,
            italic: false,
            underline: false,
            color: '#000000'
          },
          isCovered: false // True when text is edited or moved, triggering white rect background
        };

        state.pageTextBlocks[state.pageNum].push(blockData);
        renderBlockToOverlay(blockData);
      });
    }

    // REBUILD OVERLAY FROM SAVED STATE
    function rebuildOverlayFromState() {
      const blocks = state.pageTextBlocks[state.pageNum] || [];
      blocks.forEach(block => {
        renderBlockToOverlay(block);
      });
    }

    // DRAW OVERLAY BLOCK (Transparent directly over native text)
    function renderBlockToOverlay(block) {
      const wrapper = document.createElement('div');
      wrapper.className = 'text-block-wrapper';
      wrapper.id = `block-${block.id}`;
      wrapper.style.left = `${block.x}px`;
      wrapper.style.top = `${block.y}px`;
      wrapper.style.width = `${block.width}px`;
      wrapper.style.height = `${block.height}px`;

      // Input field (transparent so background document is visible until text changes)
      const input = document.createElement('textarea');
      input.className = 'transparent-input';
      input.value = block.text;
      input.style.fontFamily = block.style.fontFamily;
      input.style.fontSize = `${block.style.fontSize}px`;
      input.style.fontWeight = block.style.bold ? 'bold' : 'normal';
      input.style.fontStyle = block.style.italic ? 'italic' : 'normal';
      input.style.textDecoration = block.style.underline ? 'underline' : 'none';
      input.style.color = block.style.color;

      // Delete Button (X)
      const deleteBtn = document.createElement('button');
      deleteBtn.className = 'absolute -top-2 -right-2 bg-red-600 hover:bg-red-500 text-white w-4 h-4 rounded-full flex items-center justify-center text-[9px] shadow opacity-0 hover:opacity-100 transition-opacity z-20';
      deleteBtn.innerHTML = '<i class="fa-solid fa-xmark"></i>';
      
      wrapper.addEventListener('mouseenter', () => deleteBtn.classList.remove('opacity-0'));
      wrapper.addEventListener('mouseleave', () => {
        if (state.activeTextBlock?.id !== block.id) deleteBtn.classList.add('opacity-0');
      });

      deleteBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        deleteTextBlock(block.id);
      });

      // Selection & Focus Event Handling
      input.addEventListener('focus', () => {
        setActiveBlock(block, wrapper);
      });

      input.addEventListener('input', (e) => {
        block.text = e.target.value;
        // Text altered from native: mark covered so original canvas drawing is cleared
        if (block.isNative && block.text !== block.originalText) {
          block.isCovered = true;
          applyCanvasCovers();
        }
        // Auto adjust width dynamically
        adjustInputDimensions(wrapper, input);
      });

      // Drag & Drop Functionality
      wrapper.addEventListener('mousedown', (e) => {
        if (e.target === deleteBtn || e.target === input && document.activeElement === input) return;
        
        state.isDragging = true;
        state.activeTextBlock = block;
        setActiveBlock(block, wrapper);

        const rect = wrapper.getBoundingClientRect();
        state.dragOffset = {
          x: e.clientX - rect.left,
          y: e.clientY - rect.top
        };

        const onMouseMove = (moveEv) => {
          if (!state.isDragging) return;
          const overlayRect = textOverlay.getBoundingClientRect();
          let newX = moveEv.clientX - overlayRect.left - state.dragOffset.x;
          let newY = moveEv.clientY - overlayRect.top - state.dragOffset.y;

          // Native text moved from initial place -> clear native underlying canvas text
          if (block.isNative && !block.isCovered) {
            block.isCovered = true;
            applyCanvasCovers();
          }

          block.x = Math.max(0, newX);
          block.y = Math.max(0, newY);
          wrapper.style.left = `${block.x}px`;
          wrapper.style.top = `${block.y}px`;
        };

        const onMouseUp = () => {
          state.isDragging = false;
          window.removeEventListener('mousemove', onMouseMove);
          window.removeEventListener('mouseup', onMouseUp);
        };

        window.addEventListener('mousemove', onMouseMove);
        window.addEventListener('mouseup', onMouseUp);
      });

      wrapper.appendChild(input);
      wrapper.appendChild(deleteBtn);
      textOverlay.appendChild(wrapper);
    }

    // CLEAR UNDERLYING CANVAS FOR EDITED/MOVED NATIVE TEXT
    function applyCanvasCovers() {
      const blocks = state.pageTextBlocks[state.pageNum] || [];
      blocks.forEach(block => {
        if (block.isCovered && block.isNative) {
          // Fill white box over the native text area on canvas
          ctx.fillStyle = '#FFFFFF';
          // Slightly pad rect cover to ensure no background original text spills out
          ctx.fillRect(
            block.x - 1, 
            block.y - 1, 
            block.width + 4, 
            block.height + 2
          );
        }
      });
    }

    // DYNAMIC INPUT DIMENSION CALCULATION
    function adjustInputDimensions(wrapper, input) {
      input.style.height = 'auto';
      const newHeight = Math.max(input.scrollHeight, 18);
      wrapper.style.height = `${newHeight}px`;
      
      // Expand width if text overflows box
      if (input.scrollWidth > wrapper.clientWidth) {
        const newWidth = input.scrollWidth + 10;
        wrapper.style.width = `${newWidth}px`;
      }
    }

    // CREATE BRAND NEW TEXT BLOCK
    function createNewTextBlock(x, y, initialText = "Nuovo Testo") {
      const blockData = {
        id: `custom-${state.pageNum}-${Date.now()}`,
        isNative: false,
        text: initialText,
        x: x,
        y: y,
        width: 140,
        height: 28,
        style: { ...currentStyle },
        isCovered: false
      };

      state.pageTextBlocks[state.pageNum].push(blockData);
      renderBlockToOverlay(blockData);

      // Focus the newly created block
      setTimeout(() => {
        const wrapper = document.getElementById(`block-${blockData.id}`);
        if (wrapper) {
          const input = wrapper.querySelector('textarea');
          input?.focus();
          input?.select();
        }
      }, 50);
    }

    // DELETE TEXT BLOCK
    function deleteTextBlock(id) {
      const blocks = state.pageTextBlocks[state.pageNum];
      const index = blocks.findIndex(b => b.id === id);

      if (index !== -1) {
        const block = blocks[index];
        if (block.isNative) {
          // Flag native block as covered so white box erases old text permanently
          block.isCovered = true;
          block.text = "";
          applyCanvasCovers();
        } else {
          // Remove custom block completely
          blocks.splice(index, 1);
        }
      }

      const elem = document.getElementById(`block-${id}`);
      if (elem) elem.remove();
      state.activeTextBlock = null;
    }

    // SET ACTIVE BLOCK & SYNC FORMAT TOOLBAR
    function setActiveBlock(block, wrapper) {
      document.querySelectorAll('.text-block-wrapper').forEach(w => w.classList.remove('selected'));
      wrapper.classList.add('selected');
      state.activeTextBlock = block;

      // Update Toolbar Controls values
      fontFamilySelect.value = block.style.fontFamily;
      fontSizeInput.value = block.style.fontSize;
      textColorInput.value = block.style.color;

      currentStyle.bold = block.style.bold;
      btnBold.classList.toggle('bg-brand-900/60', currentStyle.bold);
      btnBold.classList.toggle('text-brand-400', currentStyle.bold);

      currentStyle.italic = block.style.italic;
      btnItalic.classList.toggle('bg-brand-900/60', currentStyle.italic);
      btnItalic.classList.toggle('text-brand-400', currentStyle.italic);

      currentStyle.underline = block.style.underline;
      btnUnderline.classList.toggle('bg-brand-900/60', currentStyle.underline);
      btnUnderline.classList.toggle('text-brand-400', currentStyle.underline);
    }

    // UPDATE ACTIVE TEXT PROPERTY FROM TOOLBAR
    function updateActiveTextProperty(prop, value) {
      currentStyle[prop] = value;
      if (!state.activeTextBlock) return;

      state.activeTextBlock.style[prop] = value;
      const wrapper = document.getElementById(`block-${state.activeTextBlock.id}`);
      if (!wrapper) return;

      const input = wrapper.querySelector('textarea');
      if (!input) return;

      if (prop === 'fontFamily') input.style.fontFamily = value;
      if (prop === 'fontSize') input.style.fontSize = `${value}px`;
      if (prop === 'bold') input.style.fontWeight = value ? 'bold' : 'normal';
      if (prop === 'italic') input.style.fontStyle = value ? 'italic' : 'normal';
      if (prop === 'underline') input.style.textDecoration = value ? 'underline' : 'none';
      if (prop === 'color') input.style.color = value;

      adjustInputDimensions(wrapper, input);
    }

    // ZOOM & NAVIGATION
    function changePage(delta) {
      const newPage = state.pageNum + delta;
      if (newPage >= 1 && newPage <= state.totalPages) {
        state.pageNum = newPage;
        renderPage(state.pageNum);
      }
    }

    function changeZoom(delta) {
      const newZoom = Math.min(Math.max(0.5, state.zoom + delta), 3.0);
      state.zoom = parseFloat(newZoom.toFixed(2));
      zoomLevelText.textContent = `${Math.round(state.zoom * 100)}%`;
      renderPage(state.pageNum);
    }

    function rotatePage() {
      state.rotation = (state.rotation + 90) % 360;
      renderPage(state.pageNum);
    }

    // EXPORT PDF WITH REPLACED / MODIFIED TEXT
    async function exportPDF() {
      if (!state.pdfDoc) return;

      const { jsPDF } = window.jspdf;
      let pdfOut = null;

      for (let p = 1; p <= state.totalPages; p++) {
        const page = await state.pdfDoc.getPage(p);
        const viewport = page.getViewport({ scale: 2.0, rotation: state.rotation }); // High res render scale

        // Create temporary canvas to capture modified page state
        const tempCanvas = document.createElement('canvas');
        const tempCtx = tempCanvas.getContext('2d');
        tempCanvas.width = viewport.width;
        tempCanvas.height = viewport.height;

        await page.render({ canvasContext: tempCtx, viewport: viewport }).promise;

        // Apply white covers for edited/deleted blocks
        const blocks = state.pageTextBlocks[p] || [];
        const scaleFactor = 2.0 / state.zoom;

        blocks.forEach(block => {
          if (block.isCovered && block.isNative) {
            tempCtx.fillStyle = '#FFFFFF';
            tempCtx.fillRect(
              block.x * scaleFactor - 2, 
              block.y * scaleFactor - 2, 
              block.width * scaleFactor + 6, 
              block.height * scaleFactor + 4
            );
          }
        });

        // Initialize jsPDF document on page 1
        const orientation = viewport.width > viewport.height ? 'l' : 'p';
        if (p === 1) {
          pdfOut = new jsPDF({
            orientation: orientation,
            unit: 'px',
            format: [viewport.width, viewport.height]
          });
        } else {
          pdfOut.addPage([viewport.width, viewport.height], orientation);
        }

        // Draw background canvas image
        const imgData = tempCanvas.toDataURL('image/jpeg', 0.95);
        pdfOut.addImage(imgData, 'JPEG', 0, 0, viewport.width, viewport.height);

        // Render new/modified overlay text directly into exported PDF
        blocks.forEach(block => {
          if (!block.text || block.text.trim() === '') return;
          if (block.isNative && !block.isCovered) return; // Keep original unmodified PDF render

          const scaledX = block.x * scaleFactor;
          const scaledY = (block.y + block.style.fontSize * 0.8) * scaleFactor; // Adjust baseline

          pdfOut.setFontSize(block.style.fontSize * scaleFactor);
          pdfOut.setTextColor(block.style.color);

          let fontStyle = 'normal';
          if (block.style.bold && block.style.italic) fontStyle = 'bolditalic';
          else if (block.style.bold) fontStyle = 'bold';
          else if (block.style.italic) fontStyle = 'italic';

          pdfOut.setFont('helvetica', fontStyle);
          pdfOut.text(block.text, scaledX, scaledY);
        });
      }

      if (pdfOut) {
        pdfOut.save(`FarmaExport_Modificato_${state.fileName}`);
      }
    }

    // PRINT DOCUMENT
    async function printDocument() {
      if (!state.pdfDoc) return;
      const printArea = document.getElementById('print-area');
      printArea.innerHTML = '';

      for (let p = 1; p <= state.totalPages; p++) {
        const page = await state.pdfDoc.getPage(p);
        const viewport = page.getViewport({ scale: 1.5, rotation: state.rotation });

        const printCanvas = document.createElement('canvas');
        const printCtx = printCanvas.getContext('2d');
        printCanvas.width = viewport.width;
        printCanvas.height = viewport.height;

        await page.render({ canvasContext: printCtx, viewport: viewport }).promise;

        const blocks = state.pageTextBlocks[p] || [];
        const scaleFactor = 1.5 / state.zoom;

        // Apply covers
        blocks.forEach(block => {
          if (block.isCovered && block.isNative) {
            printCtx.fillStyle = '#FFFFFF';
            printCtx.fillRect(
              block.x * scaleFactor, 
              block.y * scaleFactor, 
              block.width * scaleFactor, 
              block.height * scaleFactor
            );
          }
        });

        // Draw overlays onto print canvas
        blocks.forEach(block => {
          if (!block.text || block.text.trim() === '') return;
          if (block.isNative && !block.isCovered) return;

          printCtx.font = `${block.style.bold ? 'bold ' : ''}${block.style.italic ? 'italic ' : ''}${block.style.fontSize * scaleFactor}px ${block.style.fontFamily}`;
          printCtx.fillStyle = block.style.color;
          printCtx.fillText(block.text, block.x * scaleFactor, (block.y + block.style.fontSize * 0.8) * scaleFactor);
        });

        const img = document.createElement('img');
        img.src = printCanvas.toDataURL();
        img.style.width = '100%';
        img.style.pageBreakAfter = 'always';
        printArea.appendChild(img);
      }

      window.print();
    }
  </script>
</body>
</html>
