<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farma Export PDF</title>
    <!-- Tailwind CSS per la grafica -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PDF.js per la visualizzazione e manipolazione dei PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
    <!-- jsPDF per la generazione di file PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        .pdf-annotation-box {
            position: absolute;
            background: rgba(255, 255, 255, 0.08); /* Sfondo ultra-trasparente */
            border: 1px dashed rgba(59, 130, 246, 0.6);
            border-radius: 4px;
            z-index: 50;
            display: flex;
            flex-direction: column;
            overflow: visible;
            min-width: 140px;
            min-height: 80px;
            transition: background 0.2s, border-color 0.2s;
        }
        .pdf-annotation-box:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: #3b82f6;
        }
        .pdf-annotation-header {
            background-color: rgba(255, 255, 255, 0.25); /* Barra trasparente invece che nera */
            backdrop-filter: blur(2px);
            cursor: move;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 2px 6px;
            user-select: none;
            font-size: 11px;
            color: #1e293b;
            font-weight: 600;
            border-bottom: 1px solid rgba(59, 130, 246, 0.3);
            border-top-left-radius: 3px;
            border-top-right-radius: 3px;
        }
        .pdf-text-input {
            width: 100%;
            height: 100%;
            border: none;
            outline: none;
            background: transparent;
            padding: 4px 6px;
            font-size: 14px;
            color: #000000;
            resize: both;
            box-sizing: border-box;
            line-height: 1.2;
        }
        @media print {
            body * {
                visibility: hidden;
            }
            #print-container, #print-container * {
                visibility: visible;
            }
            #print-container {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
            }
            .print-page-wrapper {
                page-break-after: always;
                page-break-inside: avoid;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                width: 100vw;
                height: 100vh;
            }
            .print-page-wrapper canvas {
                max-width: 100%;
                max-height: 90vh;
                object-fit: contain;
            }
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Header / Barra degli Strumenti Principale -->
    <header class="bg-slate-800 border-b border-slate-700 px-4 py-3 flex flex-wrap items-center justify-between gap-4 shadow-md">
        <div class="flex items-center space-x-3">
            <span class="bg-blue-600 text-white font-bold p-2 rounded-lg text-lg">FE</span>
            <div>
                <h1 class="font-bold text-lg text-slate-100">Farma Export PDF</h1>
                <p id="fileNameEl" class="text-xs text-slate-400">Nessun file caricato</p>
            </div>
        </div>

        <div class="flex flex-wrap items-center gap-2">
            <!-- Pulsante Carica PDF -->
            <label class="bg-blue-600 hover:bg-blue-500 text-white text-sm font-semibold px-4 py-2 rounded-lg cursor-pointer transition flex items-center gap-2 shadow">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
                Apri PDF
                <input type="file" id="fileInput" accept="application/pdf" class="hidden">
            </label>

            <!-- Pulsante Conversione Immagini in PDF -->
            <button id="openImageModalBtn" class="bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-semibold px-4 py-2 rounded-lg transition flex items-center gap-2 shadow">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                Converti immagine in pdf
            </button>

            <!-- Pulsante Esempio -->
            <button id="btnSample" class="bg-slate-700 hover:bg-slate-600 text-slate-200 text-sm font-medium px-3 py-2 rounded-lg transition">
                PDF Esempio
            </button>

            <!-- Modifica / Aggiungi Testo -->
            <button id="btnAddText" class="bg-amber-600 hover:bg-amber-500 text-white text-sm font-semibold px-4 py-2 rounded-lg transition flex items-center gap-2 shadow">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                Modifica / Scrivi
            </button>

            <!-- Salva PDF -->
            <button id="btnSavePdf" class="bg-green-600 hover:bg-green-500 text-white text-sm font-semibold px-4 py-2 rounded-lg transition flex items-center gap-2 shadow">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"/></svg>
                Salva PDF
            </button>

            <!-- Stampa -->
            <button id="btnPrint" class="bg-slate-700 hover:bg-slate-600 text-slate-200 text-sm font-medium px-3 py-2 rounded-lg transition">
                Stampa
            </button>

            <!-- Installa / Scarica App -->
            <button id="btnInstall" class="bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium px-3 py-2 rounded-lg transition flex items-center gap-1">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                App
            </button>
        </div>
    </header>

    <!-- Barra Editor Testo (Formattazione) -->
    <div class="bg-slate-800 border-b border-slate-700 px-4 py-2 flex flex-wrap items-center gap-3 text-sm text-slate-200 shadow-inner">
        <span class="text-xs font-semibold uppercase text-slate-400 tracking-wider">Formattazione Testo:</span>
        
        <!-- Font Family -->
        <div class="flex items-center space-x-1">
            <label class="text-xs text-slate-400">Font:</label>
            <select id="fontFamilySelect" class="bg-slate-900 border border-slate-700 text-xs rounded px-2 py-1 text-slate-100 outline-none">
                <option value="Arial, sans-serif">Arial</option>
                <option value="'Times New Roman', serif">Times New Roman</option>
                <option value="'Courier New', monospace">Courier New</option>
                <option value="'Inter', sans-serif">Inter</option>
                <option value="Georgia, serif">Georgia</option>
                <option value="Verdana, sans-serif">Verdana</option>
            </select>
        </div>

        <!-- Dimensione Testo -->
        <div class="flex items-center space-x-1">
            <label class="text-xs text-slate-400">Dimensione:</label>
            <input type="number" id="fontSizeInput" value="14" min="8" max="72" class="w-14 bg-slate-900 border border-slate-700 text-xs rounded px-2 py-1 text-center text-slate-100 outline-none">
            <span class="text-xs">px</span>
        </div>

        <!-- Stili (Grassetto, Corsivo, Sottolineato) -->
        <div class="flex items-center space-x-1 bg-slate-900 border border-slate-700 rounded p-0.5">
            <button id="btnBold" class="px-2.5 py-0.5 text-xs font-bold rounded hover:bg-slate-700 transition" title="Grassetto">B</button>
            <button id="btnItalic" class="px-2.5 py-0.5 text-xs italic rounded hover:bg-slate-700 transition" title="Corsivo">I</button>
            <button id="btnUnderline" class="px-2.5 py-0.5 text-xs underline rounded hover:bg-slate-700 transition" title="Sottolineato">U</button>
        </div>

        <!-- Colore Testo -->
        <div class="flex items-center space-x-1">
            <label class="text-xs text-slate-400">Colore:</label>
            <input type="color" id="textColorInput" value="#000000" class="w-7 h-7 bg-transparent border-0 cursor-pointer rounded">
        </div>
    </div>

    <!-- Barra di navigazione pagine e zoom -->
    <div class="bg-slate-800/60 border-b border-slate-700/50 px-4 py-1.5 flex flex-wrap items-center justify-between gap-2 text-sm text-slate-300">
        <div class="flex items-center space-x-2">
            <button id="btnFirst" class="p-1 hover:bg-slate-700 rounded disabled:opacity-40" title="Prima Pagina">⏮</button>
            <button id="btnPrev" class="p-1 hover:bg-slate-700 rounded disabled:opacity-40" title="Pagina Precedente">◀</button>
            <div class="flex items-center space-x-1">
                <span>Pagina</span>
                <input type="number" id="pageNumInput" value="1" min="1" class="w-12 bg-slate-900 border border-slate-700 text-center rounded py-0.5 text-xs text-slate-100">
                <span>di <span id="pageCount">0</span></span>
            </div>
            <button id="btnNext" class="p-1 hover:bg-slate-700 rounded disabled:opacity-40" title="Pagina Successiva">▶</button>
            <button id="btnLast" class="p-1 hover:bg-slate-700 rounded disabled:opacity-40" title="Ultima Pagina">⏭</button>
        </div>

        <div class="flex items-center space-x-3">
            <button id="btnZoomOut" class="p-1 hover:bg-slate-700 rounded" title="Zoom Indietro">🔍-</button>
            <span id="zoomValue" class="w-12 text-center text-xs">100%</span>
            <button id="btnZoomIn" class="p-1 hover:bg-slate-700 rounded" title="Zoom Avanti">🔍+</button>
            <button id="btnZoomReset" class="px-2 py-0.5 bg-slate-700 hover:bg-slate-600 rounded text-xs">Adatta</button>
            <button id="btnRotate" class="p-1 hover:bg-slate-700 rounded text-xs" title="Ruota">🔄 Ruota</button>
        </div>
    </div>

    <!-- Area principale di visualizzazione PDF -->
    <main id="viewerContainer" class="flex-1 relative flex items-center justify-center p-4 overflow-auto bg-slate-950">
        <!-- Overlay Drag & Drop -->
        <div id="dropOverlay" class="absolute inset-0 bg-slate-900/80 backdrop-blur-sm flex flex-col items-center justify-center pointer-events-none opacity-0 transition-opacity duration-300 z-30">
            <svg class="w-16 h-16 text-blue-500 mb-2 animate-bounce" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
            <p class="text-xl font-bold text-slate-200">Rilascia qui il file PDF</p>
        </div>

        <!-- Spinner di caricamento -->
        <div id="loadingSpinner" class="absolute inset-0 bg-slate-900/50 backdrop-blur-xs flex flex-col items-center justify-center z-20 hidden">
            <div class="w-10 h-10 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mb-3"></div>
            <p id="loadingText" class="text-sm font-medium text-slate-200">Caricamento...</p>
        </div>

        <!-- Messaggio di errore -->
        <div id="errorMessage" class="absolute inset-0 bg-slate-900/90 flex flex-col items-center justify-center z-20 hidden p-6 text-center">
            <svg class="w-12 h-12 text-red-500 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
            <p id="errorText" class="text-base font-semibold text-slate-200 mb-2">Errore</p>
        </div>

        <!-- Contenitore Canvas del PDF -->
        <div id="canvasWrapper" class="relative shadow-2xl bg-white rounded overflow-hidden">
            <canvas id="pdfCanvas" class="block"></canvas>
            <div id="annotationsLayer" class="absolute inset-0 pointer-events-none"></div>
        </div>
    </main>

    <!-- Container nascosto per la stampa -->
    <div id="print-container" class="hidden"></div>

    <!-- MODALE PER CONVERSIONE IMMAGINI (JPG, JPEG, PNG) IN PDF -->
    <div id="imageModal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm flex items-center justify-center z-50 hidden">
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-6 max-w-lg w-full shadow-2xl flex flex-col max-h-[90vh]">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-slate-100">Converti Immagini in PDF</h3>
                <button id="closeImageModalBtn" class="text-slate-400 hover:text-white text-xl font-bold">&times;</button>
            </div>
            
            <p class="text-xs text-slate-400 mb-4">Seleziona uno o più file in formato JPG, JPEG o PNG. Verranno assemblati in un unico file PDF ordinato.</p>

            <label class="border-2 border-dashed border-slate-600 hover:border-emerald-500 rounded-lg p-6 text-center cursor-pointer block bg-slate-900/50 transition mb-4">
                <svg class="w-10 h-10 mx-auto text-emerald-500 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
                <span class="text-sm font-medium text-slate-200">Clicca per scegliere le immagini (.jpg, .jpeg, .png)</span>
                <input type="file" id="imageInput" accept="image/jpeg, image/jpg, image/png" multiple class="hidden">
            </label>

            <div id="imagePreviewContainer" class="flex-1 overflow-y-auto grid grid-cols-3 gap-3 mb-4 min-h-[120px] max-h-[250px] bg-slate-900/50 p-3 rounded-lg border border-slate-700/50">
                <p id="noImagesText" class="col-span-3 text-center text-xs text-slate-500 my-auto">Nessuna immagine selezionata</p>
            </div>

            <button id="generatePdfFromImagesBtn" disabled class="w-full bg-emerald-600 hover:bg-emerald-500 disabled:bg-slate-700 disabled:text-slate-500 text-white font-semibold py-2.5 rounded-lg transition shadow">
                Genera e Scarica PDF
            </button>
        </div>
    </div>

    <!-- Script principale applicativo -->
    <script>
        const state = {
            pdfDoc: null,
            pageNum: 1,
            pageRendering: false,
            pageNumPending: null,
            scale: 1.2,
            rotation: 0,
            fileName: '',
            isEditMode: false,
            annotations: {},
            activeAnnoId: null, // ID della casella correntemente selezionata
            formatting: {
                fontFamily: 'Arial, sans-serif',
                fontSize: 14,
                isBold: false,
                isItalic: false,
                isUnderline: false,
                color: '#000000'
            }
        };

        const canvas = document.getElementById('pdfCanvas');
        const ctx = canvas.getContext('2d');
        const canvasWrapper = document.getElementById('canvasWrapper');
        const annotationsLayer = document.getElementById('annotationsLayer');
        
        const fileInput = document.getElementById('fileInput');
        const fileNameEl = document.getElementById('fileNameEl');
        const pageNumInput = document.getElementById('pageNumInput');
        const pageCountEl = document.getElementById('pageCount');
        const zoomValueEl = document.getElementById('zoomValue');
        
        const btnPrev = document.getElementById('btnPrev');
        const btnNext = document.getElementById('btnNext');
        const btnFirst = document.getElementById('btnFirst');
        const btnLast = document.getElementById('btnLast');
        const btnZoomIn = document.getElementById('btnZoomIn');
        const btnZoomOut = document.getElementById('btnZoomOut');
        const btnZoomReset = document.getElementById('btnZoomReset');
        const btnRotate = document.getElementById('btnRotate');
        const btnSample = document.getElementById('btnSample');
        const btnAddText = document.getElementById('btnAddText');
        const btnSavePdf = document.getElementById('btnSavePdf');
        const btnPrint = document.getElementById('btnPrint');
        const btnInstall = document.getElementById('btnInstall');
        const viewerContainer = document.getElementById('viewerContainer');
        const dropOverlay = document.getElementById('dropOverlay');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const loadingText = document.getElementById('loadingText');
        const errorMessage = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');

        // Controlli Formattazione
        const fontFamilySelect = document.getElementById('fontFamilySelect');
        const fontSizeInput = document.getElementById('fontSizeInput');
        const btnBold = document.getElementById('btnBold');
        const btnItalic = document.getElementById('btnItalic');
        const btnUnderline = document.getElementById('btnUnderline');
        const textColorInput = document.getElementById('textColorInput');

        // Eventi Formattazione
        fontFamilySelect.addEventListener('change', (e) => {
            state.formatting.fontFamily = e.target.value;
            applyFormattingToActive();
        });

        fontSizeInput.addEventListener('input', (e) => {
            state.formatting.fontSize = parseInt(e.target.value) || 14;
            applyFormattingToActive();
        });

        btnBold.addEventListener('click', () => {
            state.formatting.isBold = !state.formatting.isBold;
            btnBold.classList.toggle('bg-blue-600', state.formatting.isBold);
            btnBold.classList.toggle('text-white', state.formatting.isBold);
            applyFormattingToActive();
        });

        btnItalic.addEventListener('click', () => {
            state.formatting.isItalic = !state.formatting.isItalic;
            btnItalic.classList.toggle('bg-blue-600', state.formatting.isItalic);
            btnItalic.classList.toggle('text-white', state.formatting.isItalic);
            applyFormattingToActive();
        });

        btnUnderline.addEventListener('click', () => {
            state.formatting.isUnderline = !state.formatting.isUnderline;
            btnUnderline.classList.toggle('bg-blue-600', state.formatting.isUnderline);
            btnUnderline.classList.toggle('text-white', state.formatting.isUnderline);
            applyFormattingToActive();
        });

        textColorInput.addEventListener('input', (e) => {
            state.formatting.color = e.target.value;
            applyFormattingToActive();
        });

        function applyFormattingToActive() {
            if (!state.activeAnnoId || !state.annotations[state.pageNum]) return;
            const anno = state.annotations[state.pageNum].find(a => a.id === state.activeAnnoId);
            if (anno) {
                anno.fontFamily = state.formatting.fontFamily;
                anno.fontSize = state.formatting.fontSize;
                anno.isBold = state.formatting.isBold;
                anno.isItalic = state.formatting.isItalic;
                anno.isUnderline = state.formatting.isUnderline;
                anno.color = state.formatting.color;
                
                const el = document.getElementById(`anno-text-${anno.id}`);
                if (el) {
                    el.style.fontFamily = anno.fontFamily;
                    el.style.fontSize = `${anno.fontSize}px`;
                    el.style.fontWeight = anno.isBold ? 'bold' : 'normal';
                    el.style.fontStyle = anno.isItalic ? 'italic' : 'normal';
                    el.style.textDecoration = anno.isUnderline ? 'underline' : 'none';
                    el.style.color = anno.color;
                }
            }
        }

        // Modale Immagini
        const imageModal = document.getElementById('imageModal');
        const openImageModalBtn = document.getElementById('openImageModalBtn');
        const closeImageModalBtn = document.getElementById('closeImageModalBtn');
        const imageInput = document.getElementById('imageInput');
        const imagePreviewContainer = document.getElementById('imagePreviewContainer');
        const noImagesText = document.getElementById('noImagesText');
        const generatePdfFromImagesBtn = document.getElementById('generatePdfFromImagesBtn');
        let selectedImageFiles = [];

        openImageModalBtn.addEventListener('click', () => imageModal.classList.remove('hidden'));
        closeImageModalBtn.addEventListener('click', () => imageModal.classList.add('hidden'));
        imageModal.addEventListener('click', (e) => { if (e.target === imageModal) imageModal.classList.add('hidden'); });

        imageInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            files.forEach(file => {
                if (['image/jpeg', 'image/jpg', 'image/png'].includes(file.type)) {
                    selectedImageFiles.push(file);
                }
            });
            updateImagePreview();
        });

        function updateImagePreview() {
            imagePreviewContainer.innerHTML = '';
            if (selectedImageFiles.length === 0) {
                imagePreviewContainer.appendChild(noImagesText);
                generatePdfFromImagesBtn.disabled = true;
                return;
            }
            generatePdfFromImagesBtn.disabled = false;
            selectedImageFiles.forEach((file, index) => {
                const reader = new FileReader();
                reader.onload = (evt) => {
                    const card = document.createElement('div');
                    card.className = 'relative group aspect-square bg-slate-950 rounded border border-slate-700 overflow-hidden flex items-center justify-center';
                    card.innerHTML = `
                        <img src="${evt.target.result}" class="w-full h-full object-cover">
                        <button onclick="removeSelectedImage(${index})" class="absolute top-1 right-1 bg-red-600 hover:bg-red-500 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs shadow">&times;</button>
                    `;
                    imagePreviewContainer.appendChild(card);
                };
                reader.readAsDataURL(file);
            });
        }

        window.removeSelectedImage = function(index) {
            selectedImageFiles.splice(index, 1);
            updateImagePreview();
        };

        generatePdfFromImagesBtn.addEventListener('click', async () => {
            if (selectedImageFiles.length === 0) return;
            showLoading(true, 'Generazione PDF da immagini...');
            imageModal.classList.add('hidden');

            try {
                const { jsPDF } = window.jspdf;
                let pdfDocJs = null;

                for (let i = 0; i < selectedImageFiles.length; i++) {
                    const file = selectedImageFiles[i];
                    const imageDataUrl = await readFileAsDataURL(file);

                    const img = new Image();
                    img.src = imageDataUrl;
                    await img.decode();

                    const pdfWidth = 210; 
                    const pdfHeight = 297;

                    let imgW = pdfWidth;
                    let imgH = (img.height * pdfWidth) / img.width;

                    if (imgH > pdfHeight) {
                        imgH = pdfHeight;
                        imgW = (img.width * pdfHeight) / img.height;
                    }

                    const xOffset = (pdfWidth - imgW) / 2;
                    const yOffset = (pdfHeight - imgH) / 2;

                    if (i === 0) {
                        pdfDocJs = new jsPDF({
                            orientation: imgW > imgH ? 'landscape' : 'portrait',
                            unit: 'mm',
                            format: [pdfWidth, pdfHeight]
                        });
                    } else {
                        pdfDocJs.addPage([pdfWidth, pdfHeight], imgW > imgH ? 'landscape' : 'portrait');
                    }

                    const format = file.type === 'image/png' ? 'PNG' : 'JPEG';
                    pdfDocJs.addImage(imageDataUrl, format, xOffset, yOffset, imgW, imgH);
                }

                showLoading(false);
                pdfDocJs.save('Immagine_convertita.pdf');
                
                selectedImageFiles = [];
                imageInput.value = '';
                updateImagePreview();
            } catch (err) {
                console.error('Errore conversione immagini:', err);
                showLoading(false);
                alert('Errore durante la creazione del PDF dalle immagini.');
            }
        });

        function readFileAsDataURL(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        function renderPage(num) {
            state.pageRendering = true;
            showLoading(true, `Rendering pagina ${num}...`);

            state.pdfDoc.getPage(num).then(page => {
                const viewport = page.getViewport({ scale: state.scale, rotation: state.rotation });
                const outputScale = window.devicePixelRatio || 1;
                canvas.width = Math.floor(viewport.width * outputScale);
                canvas.height = Math.floor(viewport.height * outputScale);
                
                canvas.style.width = Math.floor(viewport.width) + "px";
                canvas.style.height = Math.floor(viewport.height) + "px";

                const transform = outputScale !== 1 ? [outputScale, 0, 0, outputScale, 0, 0] : null;

                const renderContext = {
                    canvasContext: ctx,
                    transform: transform,
                    viewport: viewport
                };

                page.render(renderContext).promise.then(() => {
                    state.pageRendering = false;
                    showLoading(false);
                    renderAnnotationsForCurrentPage();

                    if (state.pageNumPending !== null) {
                        const nextNum = state.pageNumPending;
                        state.pageNumPending = null;
                        renderPage(nextNum);
                    }
                }).catch(err => {
                    console.error('Errore rendering:', err);
                    state.pageRendering = false;
                    showLoading(false);
                });
            }).catch(err => {
                console.error('Errore pagina:', err);
                state.pageRendering = false;
                showLoading(false);
            });

            pageNumInput.value = num;
            updateControlsState();
        }

        function queueRenderPage(num) {
            if (state.pageRendering) {
                state.pageNumPending = num;
            } else {
                renderPage(num);
            }
        }

        function updateControlsState() {
            if (!state.pdfDoc) return;
            const isFirst = state.pageNum <= 1;
            const isLast = state.pageNum >= state.pdfDoc.numPages;

            btnPrev.disabled = isFirst;
            btnFirst.disabled = isFirst;
            btnNext.disabled = isLast;
            btnLast.disabled = isLast;

            zoomValueEl.textContent = `${Math.round(state.scale * 100)}%`;
        }

        function loadPDFData(data, name = 'documento.pdf') {
            showError(false);
            showLoading(true, 'Caricamento PDF...');
            state.fileName = name;
            fileNameEl.textContent = name;
            state.annotations = {};
            state.pageRendering = false;
            state.pageNumPending = null;

            pdfjsLib.getDocument(data).promise.then(pdfDoc_ => {
                state.pdfDoc = pdfDoc_;
                state.pageNum = 1;
                state.rotation = 0;
                pageCountEl.textContent = state.pdfDoc.numPages;
                pageNumInput.max = state.pdfDoc.numPages;
                
                renderPage(state.pageNum);
            }).catch(err => {
                console.error('Errore caricamento PDF:', err);
                state.pageRendering = false;
                showLoading(false);
                showError(true, 'Impossibile leggere il file PDF.');
            });
        }

        function loadSamplePDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            doc.setFillColor(30, 41, 59);
            doc.rect(0, 0, 210, 297, 'F');
            
            doc.setTextColor(59, 130, 246);
            doc.setFontSize(24);
            doc.text("FARMA EXPORT PDF", 20, 30);

            doc.setTextColor(241, 245, 249);
            doc.setFontSize(14);
            doc.text("Benvenuti nell'applicazione sviluppata nel programma Visione Strategica Farma Export", 20, 45);

            doc.addPage();
            doc.setFillColor(15, 23, 42);
            doc.rect(0, 0, 210, 297, 'F');
            doc.setTextColor(59, 130, 246);
            doc.setFontSize(24);
            doc.text("Seconda Pagina", 20, 30);

            const pdfArrayBuffer = doc.output('arraybuffer');
            loadPDFData(pdfArrayBuffer, 'Esempio_Modificabile.pdf');
        }

        // Attivazione modalità scrittura/modifica
        btnAddText.addEventListener('click', () => {
            state.isEditMode = !state.isEditMode;
            if (state.isEditMode) {
                btnAddText.classList.remove('bg-amber-600', 'hover:bg-amber-500');
                btnAddText.classList.add('bg-green-600', 'hover:bg-green-500', 'ring-2', 'ring-white');
                canvasWrapper.style.cursor = 'crosshair';
            } else {
                btnAddText.classList.remove('bg-green-600', 'hover:bg-green-500', 'ring-2', 'ring-white');
                btnAddText.classList.add('bg-amber-600', 'hover:bg-amber-500');
                canvasWrapper.style.cursor = 'default';
            }
        });

        // Click sul canvas per aggiungere casella di testo
        canvasWrapper.addEventListener('click', (e) => {
            if (!state.isEditMode || !state.pdfDoc) return;
            if (e.target.closest('.pdf-annotation-box')) return;

            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            if (x < 0 || y < 0 || x > canvas.width || y > canvas.height) return;

            if (!state.annotations[state.pageNum]) {
                state.annotations[state.pageNum] = [];
            }

            const newId = Date.now() + Math.random();
            const newAnno = {
                id: newId,
                x: x,
                y: y,
                text: '',
                width: 180,
                height: 80,
                fontFamily: state.formatting.fontFamily,
                fontSize: state.formatting.fontSize,
                isBold: state.formatting.isBold,
                isItalic: state.formatting.isItalic,
                isUnderline: state.formatting.isUnderline,
                color: state.formatting.color
            };

            state.annotations[state.pageNum].push(newAnno);
            state.activeAnnoId = newId;

            renderAnnotationsForCurrentPage();
        });

        function renderAnnotationsForCurrentPage() {
            annotationsLayer.innerHTML = '';
            const annos = state.annotations[state.pageNum] || [];

            annos.forEach((anno) => {
                const container = document.createElement('div');
                container.className = 'pdf-annotation-box pointer-events-auto';
                container.style.left = `${anno.x}px`;
                container.style.top = `${anno.y}px`;
                container.style.width = `${anno.width}px`;
                container.style.height = `${anno.height}px`;

                // Barra Trasparente per trascinare e cancellare
                const header = document.createElement('div');
                header.className = 'pdf-annotation-header';
                
                const dragHandle = document.createElement('span');
                dragHandle.innerHTML = '⋮⋮ Sposta';
                
                const deleteBtn = document.createElement('button');
                deleteBtn.innerHTML = '&times;';
                deleteBtn.className = 'font-bold text-red-600 hover:text-red-800 px-1 text-sm leading-none';
                deleteBtn.title = 'Elimina casella';
                
                deleteBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const list = state.annotations[state.pageNum];
                    const idx = list.findIndex(a => a.id === anno.id);
                    if (idx !== -1) {
                        list.splice(idx, 1);
                        if (state.activeAnnoId === anno.id) state.activeAnnoId = null;
                        renderAnnotationsForCurrentPage();
                    }
                });

                header.appendChild(dragHandle);
                header.appendChild(deleteBtn);

                // Campo di testo
                const textarea = document.createElement('textarea');
                textarea.id = `anno-text-${anno.id}`;
                textarea.className = 'pdf-text-input';
                textarea.value = anno.text;
                textarea.placeholder = 'Scrivi qui...';

                // Applica stili correnti del testo
                textarea.style.fontFamily = anno.fontFamily || 'Arial, sans-serif';
                textarea.style.fontSize = `${anno.fontSize || 14}px`;
                textarea.style.fontWeight = anno.isBold ? 'bold' : 'normal';
                textarea.style.fontStyle = anno.isItalic ? 'italic' : 'normal';
                textarea.style.textDecoration = anno.isUnderline ? 'underline' : 'none';
                textarea.style.color = anno.color || '#000000';

                // Imposta attiva la casella al focus
                textarea.addEventListener('focus', () => {
                    state.activeAnnoId = anno.id;
                    syncFormattingToolbar(anno);
                });

                textarea.addEventListener('input', (e) => {
                    anno.text = e.target.value;
                });

                textarea.addEventListener('mouseup', () => {
                    anno.width = parseFloat(container.style.width) || anno.width;
                    anno.height = parseFloat(container.style.height) || anno.height;
                });

                // Gestione Trascina (Drag)
                let isDragging = false;
                let startX, startY, initialLeft, initialTop;

                header.addEventListener('mousedown', (e) => {
                    if (e.target === deleteBtn) return;
                    state.activeAnnoId = anno.id;
                    syncFormattingToolbar(anno);

                    isDragging = true;
                    startX = e.clientX;
                    startY = e.clientY;
                    initialLeft = anno.x;
                    initialTop = anno.y;

                    const onMouseMove = (moveEvent) => {
                        if (!isDragging) return;
                        const dx = moveEvent.clientX - startX;
                        const dy = moveEvent.clientY - startY;

                        let newX = initialLeft + dx;
                        let newY = initialTop + dy;

                        newX = Math.max(0, Math.min(newX, canvas.width - container.offsetWidth));
                        newY = Math.max(0, Math.min(newY, canvas.height - container.offsetHeight));

                        anno.x = newX;
                        anno.y = newY;
                        container.style.left = `${newX}px`;
                        container.style.top = `${newY}px`;
                    };

                    const onMouseUp = () => {
                        isDragging = false;
                        document.removeEventListener('mousemove', onMouseMove);
                        document.removeEventListener('mouseup', onMouseUp);
                    };

                    document.addEventListener('mousemove', onMouseMove);
                    document.addEventListener('mouseup', onMouseUp);
                });

                container.appendChild(header);
                container.appendChild(textarea);
                annotationsLayer.appendChild(container);
            });
        }

        function syncFormattingToolbar(anno) {
            fontFamilySelect.value = anno.fontFamily || 'Arial, sans-serif';
            fontSizeInput.value = anno.fontSize || 14;
            textColorInput.value = anno.color || '#000000';

            state.formatting.fontFamily = anno.fontFamily;
            state.formatting.fontSize = anno.fontSize;
            state.formatting.isBold = anno.isBold;
            state.formatting.isItalic = anno.isItalic;
            state.formatting.isUnderline = anno.isUnderline;
            state.formatting.color = anno.color;

            btnBold.classList.toggle('bg-blue-600', anno.isBold);
            btnBold.classList.toggle('text-white', anno.isBold);
            btnItalic.classList.toggle('bg-blue-600', anno.isItalic);
            btnItalic.classList.toggle('text-white', anno.isItalic);
            btnUnderline.classList.toggle('bg-blue-600', anno.isUnderline);
            btnUnderline.classList.toggle('text-white', anno.isUnderline);
        }

        // Stampa con formattazione
        btnPrint.addEventListener('click', async () => {
            if (!state.pdfDoc) return;
            showLoading(true, 'Preparazione stampa...');
            const printContainer = document.getElementById('print-container');
            printContainer.innerHTML = '';

            try {
                for (let i = 1; i <= state.pdfDoc.numPages; i++) {
                    const page = await state.pdfDoc.getPage(i);
                    const viewport = page.getViewport({ scale: 2.0, rotation: state.rotation });

                    const pageWrapper = document.createElement('div');
                    pageWrapper.className = 'print-page-wrapper';

                    const pCanvas = document.createElement('canvas');
                    const pCtx = pCanvas.getContext('2d');
                    pCanvas.width = viewport.width;
                    pCanvas.height = viewport.height;

                    await page.render({ canvasContext: pCtx, viewport: viewport }).promise;

                    const annos = state.annotations[i] || [];
                    annos.forEach(anno => {
                        if (anno.text.trim() !== '') {
                            const ratio = 2.0 / state.scale;
                            const fontStyleStr = `${anno.isItalic ? 'italic ' : ''}${anno.isBold ? 'bold ' : ''}${(anno.fontSize || 14) * ratio}px ${anno.fontFamily || 'Arial'}`;
                            pCtx.font = fontStyleStr;
                            pCtx.fillStyle = anno.color || '#000000';

                            const lines = anno.text.split('\n');
                            lines.forEach((line, index) => {
                                const lineY = (anno.y + 30 + (index * (anno.fontSize || 14) * 1.2)) * ratio;
                                pCtx.fillText(line, anno.x * ratio, lineY);

                                if (anno.isUnderline) {
                                    const metrics = pCtx.measureText(line);
                                    pCtx.beginPath();
                                    pCtx.strokeStyle = anno.color || '#000000';
                                    pCtx.lineWidth = 1 * ratio;
                                    pCtx.moveTo(anno.x * ratio, lineY + 2);
                                    pCtx.lineTo((anno.x + metrics.width) * ratio, lineY + 2);
                                    pCtx.stroke();
                                }
                            });
                        }
                    });

                    pageWrapper.appendChild(pCanvas);
                    printContainer.appendChild(pageWrapper);
                }

                showLoading(false);
                window.print();
            } catch (err) {
                console.error('Errore stampa:', err);
                showLoading(false);
                alert('Errore durante la preparazione della stampa.');
            }
        });

        // Salvataggio PDF con formattazione
        btnSavePdf.addEventListener('click', async () => {
            if (!state.pdfDoc) return;
            showLoading(true, 'Generazione PDF...');

            try {
                const { jsPDF } = window.jspdf;
                let pdfDocJs = null;

                for (let i = 1; i <= state.pdfDoc.numPages; i++) {
                    const page = await state.pdfDoc.getPage(i);
                    const viewport = page.getViewport({ scale: 1.5, rotation: state.rotation });
                    
                    const tmpCanvas = document.createElement('canvas');
                    const tmpCtx = tmpCanvas.getContext('2d');
                    tmpCanvas.width = viewport.width;
                    tmpCanvas.height = viewport.height;

                    await page.render({ canvasContext: tmpCtx, viewport: viewport }).promise;

                    const annos = state.annotations[i] || [];
                    annos.forEach(anno => {
                        if (anno.text.trim() !== '') {
                            const ratio = 1.5 / state.scale;
                            const fontStyleStr = `${anno.isItalic ? 'italic ' : ''}${anno.isBold ? 'bold ' : ''}${(anno.fontSize || 14) * ratio}px ${anno.fontFamily || 'Arial'}`;
                            tmpCtx.font = fontStyleStr;
                            tmpCtx.fillStyle = anno.color || '#000000';

                            const lines = anno.text.split('\n');
                            lines.forEach((line, index) => {
                                const lineY = (anno.y + 30 + (index * (anno.fontSize || 14) * 1.2)) * ratio;
                                tmpCtx.fillText(line, anno.x * ratio, lineY);

                                if (anno.isUnderline) {
                                    const metrics = tmpCtx.measureText(line);
                                    tmpCtx.beginPath();
                                    tmpCtx.strokeStyle = anno.color || '#000000';
                                    tmpCtx.lineWidth = 1 * ratio;
                                    tmpCtx.moveTo(anno.x * ratio, lineY + 2);
                                    tmpCtx.lineTo((anno.x + metrics.width) * ratio, lineY + 2);
                                    tmpCtx.stroke();
                                }
                            });
                        }
                    });

                    const imgData = tmpCanvas.toDataURL('image/jpeg', 0.95);
                    const pdfW = viewport.width / 1.5 * 0.352778;
                    const pdfH = viewport.height / 1.5 * 0.352778;

                    if (i === 1) {
                        pdfDocJs = new jsPDF({
                            orientation: pdfW > pdfH ? 'landscape' : 'portrait',
                            unit: 'mm',
                            format: [pdfW, pdfH]
                        });
                    } else {
                        pdfDocJs.addPage([pdfW, pdfH], pdfW > pdfH ? 'landscape' : 'portrait');
                    }

                    pdfDocJs.addImage(imgData, 'JPEG', 0, 0, pdfW, pdfH);
                }

                showLoading(false);
                pdfDocJs.save(`Modificato_${state.fileName}`);
            } catch (err) {
                console.error('Errore salvataggio:', err);
                showLoading(false);
                alert('Errore durante il salvataggio del PDF.');
            }
        });

        // Controlli Navigazione & Zoom
        btnPrev.addEventListener('click', () => { if (state.pageNum > 1) { state.pageNum--; queueRenderPage(state.pageNum); } });
        btnNext.addEventListener('click', () => { if (state.pageNum < state.pdfDoc.numPages) { state.pageNum++; queueRenderPage(state.pageNum); } });
        btnFirst.addEventListener('click', () => { state.pageNum = 1; queueRenderPage(state.pageNum); });
        btnLast.addEventListener('click', () => { state.pageNum = state.pdfDoc.numPages; queueRenderPage(state.pageNum); });

        pageNumInput.addEventListener('change', (e) => {
            let val = parseInt(e.target.value) || 1;
            val = Math.max(1, Math.min(val, state.pdfDoc.numPages));
            state.pageNum = val;
            queueRenderPage(state.pageNum);
        });

        btnZoomIn.addEventListener('click', () => { if (state.scale < 3.0) { state.scale += 0.25; queueRenderPage(state.pageNum); } });
        btnZoomOut.addEventListener('click', () => { if (state.scale > 0.5) { state.scale -= 0.25; queueRenderPage(state.pageNum); } });

        btnZoomReset.addEventListener('click', () => {
            const containerWidth = viewerContainer.clientWidth - 64;
            state.pdfDoc.getPage(state.pageNum).then(page => {
                const unscaledViewport = page.getViewport({ scale: 1, rotation: state.rotation });
                state.scale = Math.max(0.5, Math.min(2.5, containerWidth / unscaledViewport.width));
                queueRenderPage(state.pageNum);
            });
        });

        btnRotate.addEventListener('click', () => {
            state.rotation = (state.rotation + 90) % 360;
            queueRenderPage(state.pageNum);
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (evt) => loadPDFData(evt.target.result, file.name);
            reader.readAsArrayBuffer(file);
        });

        btnSample.addEventListener('click', () => loadSamplePDF());

        // Drag and Drop file PDF
        ['dragenter', 'dragover'].forEach(name => {
            viewerContainer.addEventListener(name, (e) => {
                e.preventDefault();
                e.stopPropagation();
                dropOverlay.classList.remove('opacity-0', 'pointer-events-none');
            });
        });

        ['dragleave', 'drop'].forEach(name => {
            viewerContainer.addEventListener(name, (e) => {
                e.preventDefault();
                e.stopPropagation();
                dropOverlay.classList.add('opacity-0', 'pointer-events-none');
            });
        });

        viewerContainer.addEventListener('drop', (e) => {
            const files = e.dataTransfer.files;
            if (files && files.length > 0) {
                const reader = new FileReader();
                reader.onload = (evt) => loadPDFData(evt.target.result, files[0].name);
                reader.readAsArrayBuffer(files[0]);
            }
        });

        function showLoading(show, text = 'Caricamento...') {
            loadingText.textContent = text;
            loadingSpinner.classList.toggle('hidden', !show);
            loadingSpinner.classList.toggle('flex', show);
        }

        function showError(show, message = '') {
            errorText.textContent = message;
            errorMessage.classList.toggle('hidden', !show);
            errorMessage.classList.toggle('flex', show);
            if (show) showLoading(false);
        }

        window.onload = function() {
            loadSamplePDF();
        };
    </script>
</body>
</html>
