<head>

  <style>
    :root {
      --primary: #1b5e20;
      --primary-light: #4c8c4a;
      --primary-dark: #003300;
      --accent: #81c784;
      --accent-warm: #f57c00;
      --bg-color: #f4f7f4;
      --card-bg: #ffffff;
      --text-color: #2c3e50;
      --text-muted: #666666;
      --border-color: #e0e0e0;
      --shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      line-height: 1.6;
      padding-bottom: 60px;
    }

    header {
      background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 100%);
      color: white;
      padding: 2.5rem 1.5rem;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      position: relative;
    }

    header h1 {
      font-size: 2.4rem;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 0.5rem;
    }

    header p {
      font-size: 1.1rem;
      color: #e8f5e9;
      font-style: italic;
    }

    .subtitle-badge {
      display: inline-block;
      background: rgba(255,255,255,0.15);
      padding: 0.3rem 1rem;
      border-radius: 20px;
      margin-top: 0.8rem;
      font-size: 0.9rem;
    }

    .container {
      max-width: 1350px;
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    .controls-section {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 1.5rem;
      margin: -2rem auto 2rem auto;
      box-shadow: var(--shadow);
      position: relative;
      z-index: 10;
    }

    .search-bar {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.2rem;
    }

    .search-bar input {
      flex: 1;
      padding: 0.8rem 1.2rem;
      border: 2px solid var(--border-color);
      border-radius: 8px;
      font-size: 1rem;
      transition: border-color 0.3s;
    }

    .search-bar input:focus {
      outline: none;
      border-color: var(--primary-light);
    }

    .filter-group {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      align-items: center;
      margin-bottom: 0.8rem;
    }

    .filter-label {
      font-weight: 600;
      font-size: 0.88rem;
      color: var(--text-muted);
      min-width: 110px;
    }

    .filter-btn {
      background: #f0f4f1;
      border: 1px solid var(--border-color);
      padding: 0.4rem 0.8rem;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.25s ease;
    }

    .filter-btn:hover, .filter-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .filter-btn.cat-btn.active {
      background: var(--primary-dark);
      border-color: var(--primary-dark);
    }

    .compare-bar {
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .compare-btn {
      background: var(--accent-warm);
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.3s;
    }

    .compare-btn:hover {
      background: #e65100;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 1.5rem;
    }

    .product-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 1px solid #eef2fe;
      transition: transform 0.25s, box-shadow 0.25s;
    }

    .product-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
    }

    .card-header {
      background: #f8faf8;
      padding: 1rem 1.2rem;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.5rem;
    }

    .card-header h2 {
      font-size: 1.15rem;
      color: var(--primary-dark);
      line-height: 1.3;
    }

    .badges {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.3rem;
      flex-shrink: 0;
    }

    .badge {
      font-size: 0.7rem;
      padding: 0.2rem 0.5rem;
      border-radius: 10px;
      font-weight: 600;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .badge-bio {
      background-color: #e8f5e9;
      color: #2e7d32;
      border: 1px solid #a5d6a7;
    }

    .badge-conv {
      background-color: #fff3e0;
      color: #e65100;
      border: 1px solid #ffe0b2;
    }

    .badge-cat {
      background-color: #e0f2fe;
      color: #0369a1;
    }

    .card-body {
      padding: 1.2rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      background: #f9fbf9;
      padding: 0.4rem 0.7rem;
      border-radius: 6px;
    }

    .info-label {
      font-weight: 600;
      color: var(--text-muted);
    }

    .app-type {
      font-weight: bold;
      color: var(--primary);
    }

    .description {
      font-size: 0.88rem;
      color: #444;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .note {
      font-size: 0.88rem;
      color: #444;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .composition {
      font-size: 0.82rem;
      background-color: #f5f5f5;
      padding: 0.7rem;
      border-left: 3px solid var(--primary-light);
      border-radius: 0 4px 4px 0;
    }

    .card-footer {
      padding: 0.8rem 1.2rem;
      background: #fafafa;
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .checkbox-container {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .btn-detail {
      background: transparent;
      color: var(--primary);
      border: 1px solid var(--primary);
      padding: 0.35rem 0.8rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.82rem;
      transition: all 0.2s;
    }

    .btn-detail:hover {
      background: var(--primary);
      color: white;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }

    .modal-content {
      background: white;
      border-radius: var(--radius);
      max-width: 900px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 2rem;
      position: relative;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    .close-btn {
      position: absolute;
      top: 1rem;
      right: 1.5rem;
      font-size: 1.8rem;
      cursor: pointer;
      color: var(--text-muted);
    }

    .close-btn:hover { color: #000; }

    .dosage-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
      font-size: 0.88rem;
    }

    .dosage-table th, .dosage-table td {
      border: 1px solid var(--border-color);
      padding: 0.6rem 0.8rem;
      text-align: left;
    }

    .dosage-table th {
      background-color: var(--primary-light);
      color: white;
    }

    .dosage-table tr:nth-child(even) {
      background-color: #f9f9f9;
    }

    .compare-table-wrapper {
      overflow-x: auto;
    }

    .compare-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1rem;
    }

    .compare-table th, .compare-table td {
      border: 1px solid var(--border-color);
      padding: 0.8rem;
      text-align: left;
      vertical-align: top;
      min-width: 200px;
    }

    .compare-table th:first-child, .compare-table td:first-child {
      position: sticky;
      left: 0;
      background: #f4f4f4;
      font-weight: bold;
      min-width: 140px;
      z-index: 2;
    }

    @media (max-width: 768px) {
      .products-grid {
        grid-template-columns: 1fr;
      }
      .search-bar {
        flex-direction: column;
      }
      .filter-label {
        min-width: 100%;
      }
    }
  </style>
</head>

    let selectedCompareIds = [];

    function renderProducts(products) {
      const grid = document.getElementById('productsGrid');
      grid.innerHTML = '';

      if (products.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 3rem; color: var(--text-muted);">Nessun prodotto trovato con i filtri selezionati.</div>`;
        return;
      }

      products.forEach(p => {
        const isChecked = selectedCompareIds.includes(p.id);
        const card = document.createElement('div');
        card.className = 'product-card';
        card.innerHTML = `
          <div class="card-header">
            <h2>${p.name}</h2>
            <div class="badges">
              <span class="badge badge-cat">${p.category}</span>
              ${p.bio ? '<span class="badge badge-bio">BIO 🌱</span>' : '<span class="badge badge-conv">CONV 🚜</span>'}
            </div>
          </div>
          <div class="card-body">
            <div class="info-row">
              <span class="info-label">Applicazione:</span>
              <span class="app-type">${p.appType}</span>
            </div>
            <div class="info-row">
              <span class="info-label">Stato Fisico:</span>
              <span>${p.state}</span>
            </div>
            <p class="description">${p.description}</p>
            <div class="composition">
              <strong>Composizione:</strong> ${p.composition}
            </div>
          </div>
          <div class="card-footer">
            <label class="checkbox-container">
              <input type="checkbox" onchange="toggleCompare('${p.id}')" ${isChecked ? 'checked' : ''}> Confronta
            </label>
            <button class="btn-detail" onclick="openDetailModal('${p.id}')">Dettagli & Dosi</button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function filterProducts() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      
      const activeRegBtn = document.querySelector('.reg-btn.active');
      const regimeFilter = activeRegBtn ? activeRegBtn.dataset.regime : 'all';

      const activeAppBtn = document.querySelector('.app-btn.active');
      const appFilter = activeAppBtn ? activeAppBtn.dataset.app : 'all';

      const activeCatBtn = document.querySelector('.cat-btn.active');
      const catFilter = activeCatBtn ? activeCatBtn.dataset.cat : 'all';

      const filtered = productsData.filter(p => {
        const matchesQuery = p.name.toLowerCase().includes(query) ||
                             p.description.toLowerCase().includes(query) ||
                             p.composition.toLowerCase().includes(query) ||
                             p.dosages.some(d => d.crop.toLowerCase().includes(query));

        let matchesRegime = true;
        if (regimeFilter === 'bio') matchesRegime = p.bio === true;
        if (regimeFilter === 'conv') matchesRegime = p.bio === false;

        let matchesApp = true;
        if (appFilter !== 'all') matchesApp = p.appType.includes(appFilter);

        let matchesCat = true;
        if (catFilter !== 'all') matchesCat = p.category === catFilter;

        return matchesQuery && matchesRegime && matchesApp && matchesCat;
      });

      renderProducts(filtered);
    }

    // Event Listener per tutti i gruppi di filtri
    document.querySelectorAll('.reg-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.reg-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        filterProducts();
      });
    });

    document.querySelectorAll('.app-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.app-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        filterProducts();
      });
    });

    document.querySelectorAll('.cat-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        filterProducts();
      });
    });

    document.getElementById('searchInput').addEventListener('input', filterProducts);

    function openDetailModal(productId) {
      const product = productsData.find(p => p.id === productId);
      if (!product) return;

      const modalContent = document.getElementById('modalDetailContent');
      
      let dosageRows = product.dosages.map(d => `
        <tr>
          <td><strong>${d.crop}</strong></td>
          <td>${d.foliar}</td>
          <td>${d.radical}</td>
        </tr>
      `).join('');

      modalContent.innerHTML = `
        <span class="close-btn" onclick="closeDetailModal()">&times;</span>
        <h2 style="color: var(--primary-dark); margin-bottom: 0.5rem;">${product.name}</h2>
        <div style="margin-bottom: 1rem; display:flex; gap:0.5rem;">
          ${product.bio ? '<span class="badge badge-bio">Consentito in Agricoltura Biologica 🌱</span>' : '<span class="badge badge-conv">Uso Convenzionale 🚜</span>'}

        </div>

        <p><strong>Descrizione:</strong> ${product.description}</p>
        <br>
        <p><strong>Composizione:</strong> ${product.composition}</p>
        <p style="margin-top:0.4rem;"><strong>Stato Fisico:</strong> ${product.state} | <strong>pH:</strong> ${product.ph}</p>
        <p><strong>Confezioni Disponibili:</strong> ${product.packs}</p>
        <p style="margin-top: 0.5rem; background:#f4f7f4; padding:0.6rem; border-radius:6px;"><strong>Indicazioni Generali:</strong> ${product.dosageGeneral}</p>

        <h3 style="margin-top: 1.5rem; color: var(--primary);">Tabella Dosaggi Orientativi</h3>
        <table class="dosage-table">
          <thead>
            <tr>
              <th>Coltura / Ambito</th>
              <th>Dose Fogliare</th>
              <th>Dose Radicale</th>
            </tr>
          </thead>
          <tbody>
            ${dosageRows}
          </tbody>
        </table>
      `;

      document.getElementById('detailModal').style.display = 'flex';
    }

    function closeDetailModal() {
      document.getElementById('detailModal').style.display = 'none';
    }

    function toggleCompare(id) {
      if (selectedCompareIds.includes(id)) {
        selectedCompareIds = selectedCompareIds.filter(item => item !== id);
      } else {
        if (selectedCompareIds.length >= 4) {
          alert('Puoi selezionare al massimo 4 prodotti per il confronto.');
          filterProducts();
          return;
        }
        selectedCompareIds.push(id);
      }
      document.getElementById('compareCount').innerText = `${selectedCompareIds.length} prodotti selezionati per il confronto`;
    }

            <tr>
              <td>Composizione</td>
              ${selectedProducts.map(p => `<td><small>${p.composition}</small></td>`).join('')}
            </tr>
            <tr>
              <td>Indicazioni Dosaggio</td>
              ${selectedProducts.map(p => `<td><small>${p.dosageGeneral}</small></td>`).join('')}
            </tr>
            <tr>
              <td>Confezioni</td>
              ${selectedProducts.map(p => `<td><small>${p.packs}</small></td>`).join('')}
            </tr>
          </tbody>
        </table>
      `;

      container.innerHTML = tableHTML;
      document.getElementById('compareModal').style.display = 'flex';
    }

    function closeCompareModal() {
      document.getElementById('compareModal').style.display = 'none';
    }

    window.onclick = function(event) {
      const detailModal = document.getElementById('detailModal');
      const compareModal = document.getElementById('compareModal');
      if (event.target === detailModal) detailModal.style.display = "none";
      if (event.target === compareModal) compareModal.style.display = "none";
    }

    // Inizializzazione iniziale con tutti i 71 prodotti
    renderProducts(productsData);
  </script>
</body>
</html>
